<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>마트 놀이 동전 계산</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  background:linear-gradient(180deg,#E8F5E9 0%,#C8E6C9 100%);min-height:100vh;}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:12px;position:relative;}
.screen{display:none;}
.screen.on{display:block;animation:fadein .25s;}
@keyframes fadein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
#hud{display:none;align-items:center;gap:8px;padding:8px 10px;background:#FFFFFFCC;
  border-radius:16px;margin-bottom:10px;box-shadow:0 2px 6px #0002;}
.hud-item{font-size:22px;font-weight:bold;color:#33691E;}
.hud-btn{font-size:19px;font-weight:bold;border:none;background:#AED581;color:#33691E;
  border-radius:12px;padding:8px 12px;min-height:44px;font-family:inherit;}
.gear{margin-left:auto;border:none;background:#EEE;border-radius:50%;
  width:40px;height:40px;font-size:20px;}
h1{color:#2E7D32;font-size:30px;text-align:center;margin:8px 0;line-height:1.3;}
h2{color:#2E7D32;font-size:24px;text-align:center;}
.mascot{font-size:80px;text-align:center;margin:16px 0 4px;line-height:1;}
.sub{text-align:center;color:#558B2F;font-size:18px;margin:4px 0 16px;}
.btn{display:block;width:100%;min-height:64px;font-size:24px;font-weight:bold;
  border:none;border-radius:20px;margin:10px 0;cursor:pointer;
  box-shadow:0 4px 0 #0002;font-family:inherit;}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #0002;}
.big{background:#43A047;color:#fff;font-size:30px;min-height:80px;}
.mid{background:#FFD54F;color:#6D4C00;}
#orderCard{background:#FFF;border-radius:20px;padding:14px;text-align:center;
  box-shadow:0 3px 8px #0002;margin-bottom:10px;}
#custFace{font-size:56px;line-height:1.1;}
#orderText{font-size:24px;font-weight:bold;color:#4E342E;margin-top:4px;}
#coinRow{display:flex;gap:10px;justify-content:center;margin:12px 0;}
.coin{flex:1;max-width:120px;min-height:76px;border:none;border-radius:50px;
  font-size:22px;font-weight:bold;box-shadow:0 4px 0 #0003;cursor:pointer;font-family:inherit;}
.coin:active{transform:translateY(2px);}
.coin.c100{background:#FFD700;color:#7A5C00;}
.coin.c10{background:#C0C0C0;color:#444;}
.coin.c1{background:#CD7F32;color:#FFF;}
.coin.need{animation:needglow .8s infinite alternate;}
@keyframes needglow{from{box-shadow:0 0 4px #43A047;}to{box-shadow:0 0 20px #1B5E20;}}
#counter{background:#FFF8E1;border:3px dashed #FFB300;border-radius:16px;
  min-height:96px;padding:8px;text-align:center;}
#counterCoins{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;min-height:44px;}
.chip{border:none;border-radius:50%;width:46px;height:46px;font-size:14px;font-weight:bold;
  box-shadow:0 2px 0 #0003;cursor:pointer;font-family:inherit;}
#counterTotal{font-size:22px;font-weight:bold;color:#E65100;margin-top:4px;}
#feedback{min-height:30px;text-align:center;font-size:19px;color:#6A1B9A;
  font-weight:bold;margin:6px 0;}
#goalBar{background:#FFF;border-radius:12px;padding:8px;text-align:center;
  font-size:18px;color:#33691E;font-weight:bold;margin-bottom:10px;}
.shopgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0;}
.shopitem{background:#FFF;border:none;border-radius:16px;padding:10px 4px;text-align:center;
  box-shadow:0 3px 6px #0002;cursor:pointer;font-family:inherit;min-height:100px;}
.shopitem .em{font-size:40px;line-height:1.2;}
.shopitem .nm{font-size:14px;color:#4E342E;font-weight:bold;}
.shopitem .pr{font-size:15px;color:#F57F17;font-weight:bold;}
.shopitem.owned{outline:3px solid #81C784;}
.shopitem.wearing{outline:3px solid #FF8F00;background:#FFF8E1;}
#avatar{background:#FFF;border-radius:20px;padding:10px;text-align:center;
  box-shadow:0 3px 8px #0002;margin:8px 0;}
.av-line{font-size:44px;line-height:1.15;min-height:50px;}
.tabrow{display:flex;gap:8px;}
.tabrow .btn{margin:6px 0;}
.tab-off{background:#E0E0E0;color:#777;}
.ov{display:none;position:fixed;inset:0;background:#0008;z-index:50;
  align-items:center;justify-content:center;padding:16px;}
.ov.on{display:flex;}
.ov-box{background:#FFF;border-radius:24px;padding:24px 18px;max-width:420px;width:100%;
  text-align:center;max-height:90vh;overflow:auto;}
.ov-box h3{color:#2E7D32;font-size:22px;margin:0 0 12px;}
.codebox{font-size:26px;font-weight:bold;letter-spacing:2px;color:#1565C0;
  background:#E3F2FD;border-radius:12px;padding:14px 6px;margin:12px 0;word-break:break-all;}
input,select{width:100%;min-height:52px;font-size:20px;border:2px solid #81C784;
  border-radius:12px;padding:6px 10px;margin:6px 0;font-family:inherit;background:#FFF;}
.plabel{display:block;text-align:left;font-size:16px;color:#33691E;font-weight:bold;margin-top:12px;}
.fly{position:fixed;font-size:38px;z-index:99;transition:all .8s cubic-bezier(.5,-0.2,.8,1);
  pointer-events:none;}
.pop{display:inline-block;animation:pop .5s;}
@keyframes pop{0%{transform:scale(0);}70%{transform:scale(1.3);}100%{transform:scale(1);}}
#scr_parent{background:#F1F8E9;border-radius:16px;padding:12px;}
</style>
</head>
<body>
<div id="app">

  <div id="hud">
    <div class="hud-item">⭐ <span class="hud-stars">0</span></div>
    <button id="btnShop" class="hud-btn">👕 상점·옷장</button>

    <div class="mascot" id="startAvatar">🐻</div>
    <h1>마트 놀이 동전 계산</h1>
    <p class="sub">점원이 되어 손님을 맞이하고<br>모은 별로 옷을 사요!</p>
    <button id="btnStart" class="btn big">▶ 가게 문 열기</button>
    <button id="btnShowCode" class="btn mid">🔑 이어하기 코드 보기</button>

  <div id="scr_game" class="screen">
    <div id="goalBar">오늘의 손님 <span id="goalNow">0</span> / <span id="goalMax">5</span></div>
    <div id="orderCard">
      <div id="custFace">🐰</div>
      <div id="orderText"></div>
      <button id="btnSpeak" class="btn mid" style="min-height:48px;font-size:17px;width:auto;padding:0 16px;margin:8px auto 0;">🔊 다시 듣기</button>
    </div>
    <div id="coinRow">
      <button id="coin100" class="coin c100" style="display:none;">100원</button>
      <button id="coin10" class="coin c10">10원</button>
      <button id="coin1" class="coin c1">1원</button>
    </div>
    <div id="counter">
      <div id="counterCoins"></div>
      <div id="counterTotal">계산대: 0원</div>
    </div>
    <div id="feedback"></div>
    <button id="btnPay" class="btn big" style="font-size:24px;min-height:64px;">💰 돈 내기</button>
  </div>

  <div id="scr_shop" class="screen">
    <div id="avatar">
      <div class="av-line" id="avHat"></div>
      <div class="av-line">🐻</div>
      <div class="av-line" id="avTop"></div>
      <div class="av-line" id="avShoes"></div>
    </div>
    <div class="tabrow">
      <button id="tabShop" class="btn mid" style="font-size:19px;min-height:56px;">🛍️ 별 상점</button>
      <button id="tabCloset" class="btn tab-off" style="font-size:19px;min-height:56px;">👚 내 옷장</button>

    <p class="sub" id="shopMsg" style="margin:4px 0;"></p>

  <div id="scr_end" class="screen">
    <div class="mascot">🌙🏪</div>

    <p class="sub" id="endMsg"></p>
    <button id="btnEndShop" class="btn mid">👕 상점·옷장 구경하기</button>
    <button id="btnEndCode" class="btn mid">🔑 이어하기 코드 보기</button>

  <div id="scr_parent" class="screen">

      <option value="ten">10원 단위만 (10~90원)</option>

    <input id="setGoal" type="number" min="1" max="20">
    <button id="btnParentClose" class="btn big" style="font-size:22px;">저장하고 닫기</button>
  </div>

</div>

<div id="ov_gate" class="ov">
  <div class="ov-box">
    <h3>부모님 확인 문제</h3>

<div id="ov_codeview" class="ov">

</div>

<div id="ov_codein" class="ov">

    <input id="codeIn" placeholder="예: AB2C-DE3F-GH4J-KLM" autocapitalize="characters">
    <button id="btnCodeApply" class="btn mid">불러오기</button>

</div>

<div id="ov_thanks" class="ov">

    <div style="font-size:70px;" id="thanksFace">🐰</div>

    <button id="btnThanksNext" class="btn big" style="font-size:24px;">다음 손님</button>

</div>

<script>
/* ============================================================
   공통 저장 라이브러리 v1 — 부록 A 공통 저장 규격 v2 구현
   모든 게임에 이 블록을 그대로 <script> 안에 붙여 넣는다.
   게임별로 바꾸는 것은 GAME_ID 한 줄뿐이다.
   ============================================================ */
var GAME_ID = "mart1"; // 저장 키: game_save_mart1

/* 세이브 코드 문자셋: 영문 대문자+숫자 32자, O·0·I·1 제외 */
var CS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

/* ---------- localStorage 안전 입출력 ---------- */
function lsGet(k, def) {
  try {
    var v = JSON.parse(localStorage.getItem(k));
    return (v && typeof v === "object") ? v : JSON.parse(JSON.stringify(def));
  } catch (e) { return JSON.parse(JSON.stringify(def)); }
}
function lsSet(k, obj) {
  try { localStorage.setItem(k, JSON.stringify(obj)); } catch (e) { /* 저장 실패해도 게임은 계속 */ }
}

/* ---------- 공용 4키 (있는 키는 절대 지우지 않고 읽어서 이어 씀) ---------- */
function getWallet()  { return lsGet("game_wallet",     {v:1, stars:0, total:0}); }
function getCloset()  { return lsGet("game_closet",     {v:1, owned:[], wearing:{}}); }
function getColl()    { return lsGet("game_collection", {v:1, badges:[], cards:[]}); }
function getSave(def) { return lsGet("game_save_" + GAME_ID, def || {}); }
function putWallet(w) { lsSet("game_wallet", w); }
function putCloset(c) { lsSet("game_closet", c); }
function putColl(c)   { lsSet("game_collection", c); }
function putSave(s)   { lsSet("game_save_" + GAME_ID, s); }

/* 별 획득: stars와 total을 함께 올린다. total은 절대 줄지 않는다 */
function addStars(n) {
  var w = getWallet(); w.stars += n; w.total += n; putWallet(w);
}
/* 별 사용(상점): stars만 줄인다. 부족하면 false */
function spendStars(n) {
  var w = getWallet(); if (w.stars < n) return false;
  w.stars -= n; putWallet(w); return true;
}
/* 뱃지·카드 획득(중복 방지) */
function addBadge(n) { var c = getColl(); if (c.badges.indexOf(n) < 0) { c.badges.push(n); putColl(c); } }
function addCard(n)  { var c = getColl(); if (c.cards.indexOf(n)  < 0) { c.cards.push(n);  putColl(c); } }

/* ---------- 세이브 코드 (15자: 데이터 14 + 검사 1, 4자마다 하이픈) ----------
   구성: stars(2) total(2) closet소유비트(3) badges비트(3) cards비트(2) 진행p1(1) 진행p2(1)
   숫자 2자 = 0~1023, 비트 3자 = 항목 1~15번, 비트 2자 = 항목 1~10번, 1자 = 0~31 */
function enc2(n) { n = Math.max(0, Math.min(1023, Math.round(n||0))); return CS[Math.floor(n/32)] + CS[n%32]; }
function dec2(s) { return CS.indexOf(s[0])*32 + CS.indexOf(s[1]); }
function encBits(arr, chars) { /* 번호 배열 -> chars글자 비트마스크 */
  var bits = 0;
  (arr||[]).forEach(function(x){ x = parseInt(x,10); if (x >= 1 && x <= chars*5) bits |= (1 << (x-1)); });
  var out = "";
  for (var i = chars-1; i >= 0; i--) out += CS[(bits >> (i*5)) & 31];
  return out;
}
function decBits(s) { /* 글자들 -> 번호 배열 */
  var bits = 0, i;
  for (i = 0; i < s.length; i++) bits = (bits << 5) | CS.indexOf(s[i]);
  var arr = [];
  for (i = 1; i <= s.length*5; i++) if (bits & (1 << (i-1))) arr.push(i);
  return arr;
}
function makeCode(p1, p2) {
  var w = getWallet(), c = getCloset(), k = getColl();
  var raw = enc2(w.stars) + enc2(w.total) + encBits(c.owned,3) + encBits(k.badges,3) + encBits(k.cards,2) + CS[Math.max(0,Math.min(31,p1||0))] + CS[Math.max(0,Math.min(31,p2||0))];
  var sum = 0; for (var i = 0; i < raw.length; i++) sum += CS.indexOf(raw[i]);
  raw += CS[sum % 32];
  return raw.replace(/(.{4})/g, "$1-").replace(/-$/, "");
}
function parseCode(str) {
  var raw = (str||"").toUpperCase().replace(/[^A-Z2-9]/g, "");
  if (raw.length !== 15) return null;
  var sum = 0, i, x;
  for (i = 0; i < 14; i++) { x = CS.indexOf(raw[i]); if (x < 0) return null; sum += x; }
  if (CS[sum % 32] !== raw[14]) return null; /* 검사 글자 불일치 = 오타 */
  return {
    stars:  dec2(raw.slice(0,2)),
    total:  dec2(raw.slice(2,4)),
    owned:  decBits(raw.slice(4,7)),
    badges: decBits(raw.slice(7,10)),
    cards:  decBits(raw.slice(10,12)),
    p1: CS.indexOf(raw[12]),
    p2: CS.indexOf(raw[13])
  };
}
/* 복원 적용: 재산이 지금보다 적으면 confirmFn(안내문)이 true일 때만 덮어씀.
   total은 어떤 경우에도 큰 값을 유지한다. 반환: "ok" | "cancel" | "bad" */
function applyCode(str, confirmFn) {
  var d = parseCode(str);
  if (!d) return "bad";
  var w = getWallet();
  if (d.total < w.total || d.stars < w.stars) {
    var msg = "입력한 코드의 재산(별 " + d.stars + "개)이 지금 기기(별 " + w.stars + "개)보다 적어요. 그래도 코드 쪽으로 되돌릴까요?";
    if (!confirmFn(msg)) return "cancel";
  }
  putWallet({v:1, stars:d.stars, total:Math.max(d.total, w.total)});
  var c = getCloset(); c.owned = d.owned; putCloset(c);
  putColl({v:1, badges:d.badges, cards:d.cards});
  return "ok";
}

/* ---------- 한국어 음성(TTS): 화면 첫 터치 후부터 동작 ---------- */
function speak(txt) {
  try {
    if (!window.speechSynthesis) return;
    var u = new SpeechSynthesisUtterance(txt);
    u.lang = "ko-KR"; u.rate = 0.9;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}
/* ---------- 효과음(WebAudio, 외부 파일 없음) ---------- */
var _ac = null;
function _ctx() { if (!_ac) { try { _ac = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} } return _ac; }
function beep(freq, dur, type) {
  var ac = _ctx(); if (!ac) return;
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = type || "sine"; o.frequency.value = freq;
  g.gain.setValueAtTime(0.25, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + (dur||0.15));
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + (dur||0.15));
}
function sfxGood()  { beep(660,0.12); setTimeout(function(){beep(880,0.12);},110); setTimeout(function(){beep(1320,0.2);},220); }
function sfxHint()  { beep(440,0.15,"triangle"); }
function sfxDone()  { [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){beep(f,0.18);}, i*140); }); }
/* ============================================================ */

/* ============================================================
   게임 본체: 마트 놀이 동전 계산 (게임ID mart1)
   ============================================================ */

var CUSTOMERS = ["🐰","🐻","🐱","🐶","🦊","🐼","🐨","🐷","🐹","🐸"];
var GOODS = [
  {em:"🥕", nm:"당근"}, {em:"🍎", nm:"사과"}, {em:"🍌", nm:"바나나"},
  {em:"🥛", nm:"우유"}, {em:"🍞", nm:"빵"},   {em:"🍬", nm:"사탕"},
  {em:"🧀", nm:"치즈"}, {em:"🍪", nm:"과자"}, {em:"🐟", nm:"생선"},
  {em:"🥚", nm:"달걀"}
];
/* 아바타 상점 아이템 12개 (번호 1~12, 가격 별 3~15) */
var ITEMS = [
  {id:1,  em:"🧢", nm:"야구 모자",   part:"hat",   price:3},
  {id:2,  em:"👒", nm:"밀짚모자",    part:"hat",   price:5},
  {id:3,  em:"🎩", nm:"마술사 모자", part:"hat",   price:8},
  {id:4,  em:"👑", nm:"반짝 왕관",   part:"hat",   price:15},
  {id:5,  em:"👕", nm:"티셔츠",      part:"top",   price:3},
  {id:6,  em:"🦺", nm:"멋진 조끼",   part:"top",   price:6},
  {id:7,  em:"🧥", nm:"따뜻한 코트", part:"top",   price:10},
  {id:8,  em:"👗", nm:"파티 드레스", part:"top",   price:12},
  {id:9,  em:"🥿", nm:"귀여운 단화", part:"shoes", price:4},
  {id:10, em:"👟", nm:"운동화",      part:"shoes", price:7},
  {id:11, em:"👢", nm:"긴 부츠",     part:"shoes", price:9},
  {id:12, em:"👠", nm:"반짝 구두",   part:"shoes", price:14}
];

var save = getSave({v:1, mode:"ten", goal:5, date:"", doneToday:0, served:0});
if (!save.mode) save.mode = "ten";
if (!save.goal) save.goal = 5;

function todayStr(){ var d = new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function resetDaily(){
  if (save.date !== todayStr()) { save.date = todayStr(); save.doneToday = 0; putSave(save); }
}
resetDaily();

/* ---------- 화면 유틸 ---------- */
function $(id){ return document.getElementById(id); }
var HUD_ON = {scr_game:1, scr_shop:1, scr_end:1};
function show(id){
  var s = document.querySelectorAll(".screen");
  for (var i = 0; i < s.length; i++) s[i].classList.remove("on");
  $(id).classList.add("on");
  $("hud").style.display = HUD_ON[id] ? "flex" : "none";
  updateHud();
}
function updateHud(){
  var w = getWallet();
  var els = document.querySelectorAll(".hud-stars");
  for (var i = 0; i < els.length; i++) els[i].textContent = w.stars;
  $("goalNow").textContent = Math.min(save.doneToday, save.goal);
  $("goalMax").textContent = save.goal;
  renderAvatarInto("startAvatar");
}
function flyStar(count){
  var t = $("hud").querySelector(".hud-item").getBoundingClientRect();
  for (var i = 0; i < count; i++) {
    (function(i){
      setTimeout(function(){
        var s = document.createElement("div");
        s.className = "fly"; s.textContent = "⭐";
        s.style.left = "45%"; s.style.top = "45%";
        document.body.appendChild(s);
        requestAnimationFrame(function(){
          requestAnimationFrame(function(){
            s.style.left = t.left + "px"; s.style.top = t.top + "px";
            s.style.transform = "scale(.4)"; s.style.opacity = ".6";
          });
        });
        setTimeout(function(){ if (s.parentNode) s.parentNode.removeChild(s); updateHud(); }, 850);
      }, i * 220);
    })(i);
  }
}
function itemById(id){
  for (var i = 0; i < ITEMS.length; i++) if (ITEMS[i].id === id) return ITEMS[i];
  return null;
}
function wearingEmoji(part){
  var w = getCloset().wearing || {};
  var it = w[part] ? itemById(w[part]) : null;
  return it ? it.em : "";
}
function renderAvatar(){
  $("avHat").textContent = wearingEmoji("hat");
  $("avTop").textContent = wearingEmoji("top");
  $("avShoes").textContent = wearingEmoji("shoes");
}
function renderAvatarInto(elId){
  var el = $(elId); if (!el) return;
  var h = wearingEmoji("hat"), t = wearingEmoji("top"), sh = wearingEmoji("shoes");
  el.innerHTML = (h ? h + "<br>" : "") + "🐻" + (t ? "<br>" + t : "") + (sh ? "<br>" + sh : "");
}

/* ---------- 연습 마트 ---------- */
var price = 0, placed = [], attempts = 0, guided = false, needCombo = null, cust = null, good = null;

function rand(n){ return Math.floor(Math.random() * n); }

function genPrice(){
  if (save.mode === "one") return 10 * (1 + rand(9)) + (1 + rand(9));
  if (save.mode === "hundred") return 100 * (1 + rand(2)) + 10 * rand(10);
  return 10 * (1 + rand(9)); /* ten: 10~90원 10원 단위 */
}
function comboOf(p){
  return {c100: Math.floor(p / 100), c10: Math.floor((p % 100) / 10), c1: p % 10};
}
function comboText(c){
  var parts = [];
  if (c.c100) parts.push("100원 " + c.c100 + "개");
  if (c.c10) parts.push("10원 " + c.c10 + "개");
  if (c.c1) parts.push("1원 " + c.c1 + "개");
  return parts.join(", ");
}
function counterTotal(){
  var t = 0;
  for (var i = 0; i < placed.length; i++) t += placed[i];
  return t;
}
function renderCounter(){
  var box = $("counterCoins"); box.innerHTML = "";
  placed.forEach(function(v, idx){
    var b = document.createElement("button");
    b.className = "chip " + (v === 100 ? "c100" : v === 10 ? "c10" : "c1");
    b.textContent = v + "원";
    b.onclick = function(){
      if (guided) return;
      placed.splice(idx, 1); renderCounter();
    };
    box.appendChild(b);
  });
  $("counterTotal").textContent = "계산대: " + counterTotal() + "원";
}
function nextCustomer(){
  if (save.doneToday >= save.goal) { showEnd(); return; }
  price = genPrice();
  cust = CUSTOMERS[rand(CUSTOMERS.length)];
  good = GOODS[rand(GOODS.length)];
  placed = []; attempts = 0; guided = false; needCombo = null;
  $("custFace").textContent = cust;
  $("orderText").textContent = good.em + " " + good.nm + " " + price + "원 주세요!";
  $("feedback").textContent = "";
  $("coin100").style.display = (save.mode === "hundred") ? "block" : "none";
  $("coin100").classList.remove("need");
  $("coin10").classList.remove("need");
  $("coin1").classList.remove("need");
  $("btnPay").style.display = "block";
  renderCounter();
  show("scr_game");
  speak(good.nm + " " + price + "원 주세요!");
}
function addCoin(v){
  if (guided) { guidedAdd(v); return; }
  placed.push(v); renderCounter();
}
$("coin100").onclick = function(){ addCoin(100); };
$("coin10").onclick = function(){ addCoin(10); };
$("coin1").onclick = function(){ addCoin(1); };

$("btnPay").onclick = function(){
  if (guided) return;
  var t = counterTotal();
  attempts++;
  if (t === price) {
    finishCustomer(attempts === 1 ? 2 : 1);
  } else {
    sfxHint();
    var diff;
    if (t < price) {
      diff = "계산대에 " + t + "원 있어요. " + price + "원이 되려면 조금 더 놓아 볼까요?";
    } else {
      diff = "계산대에 " + t + "원 있어요. " + price + "원보다 많아요. 조금 빼 볼까요?";
    }
    if (attempts >= 3) startGuided();
    else { $("feedback").textContent = diff; speak(diff); }
  }
};
function startGuided(){
  guided = true;
  needCombo = comboOf(price);
  placed = []; renderCounter();
  var txt = "정답은 " + comboText(needCombo) + "예요. 반짝이는 동전을 따라 눌러 보세요!";
  $("feedback").textContent = txt;
  $("btnPay").style.display = "none";
  updateNeedGlow();
  speak(txt);
}
function updateNeedGlow(){
  var c = comboOf(counterTotal());
  $("coin100").classList.toggle("need", guided && c.c100 < needCombo.c100);
  $("coin10").classList.toggle("need", guided && c.c10 < needCombo.c10);
  $("coin1").classList.toggle("need", guided && c.c1 < needCombo.c1);
}
function guidedAdd(v){
  var c = comboOf(counterTotal());
  var key = v === 100 ? "c100" : v === 10 ? "c10" : "c1";
  if (c[key] >= needCombo[key]) {
    sfxHint();
    $("feedback").textContent = v + "원은 이제 충분해요! 반짝이는 동전을 눌러 보세요.";
    return;
  }
  placed.push(v); renderCounter(); updateNeedGlow();
  if (counterTotal() === price) finishCustomer(0);
}
function finishCustomer(stars){
  sfxGood();
  if (stars > 0) { addStars(stars); flyStar(stars); }
  save.doneToday++; save.served++;
  putSave(save); /* 판이 끝날 때마다 자동 저장 */
  updateHud();
  var starTxt = stars === 2 ? "별 2개!" : (stars === 1 ? "별 1개!" : "잘 따라 놓았어요!");
  $("thanksFace").innerHTML = "<span class='pop'>" + cust + "💕</span>";
  $("thanksMsg").textContent = "고마워요! 딱 맞게 받았어요! " + starTxt;
  $("ov_thanks").classList.add("on");
  $("btnThanksNext").textContent = (save.doneToday >= save.goal) ? "가게 문 닫기" : "다음 손님";
  speak("고마워요! 딱 맞아요!");
}
$("btnThanksNext").onclick = function(){
  $("ov_thanks").classList.remove("on");
  if (save.doneToday >= save.goal) showEnd(); else nextCustomer();
};
$("btnSpeak").onclick = function(){ if (good) speak(good.nm + " " + price + "원 주세요!"); };

function showEnd(){
  show("scr_end");
  $("endMsg").textContent = "오늘 손님 " + save.doneToday + "명을 받았어요. 최고의 점원이에요! 내일 또 만나요!";
  sfxDone();
  speak("오늘은 여기까지! 가게 문 닫습니다. 정말 잘했어요!");
}

/* ---------- 아바타 상점·옷장 ---------- */
var shopTab = "shop";
var shopFrom = "scr_start";
function openShop(from){
  shopFrom = from;
  shopTab = "shop";
  renderShop();
  show("scr_shop");
}
$("btnShop").onclick = function(){ openShop(save.doneToday >= save.goal ? "scr_end" : "scr_game"); };
$("btnEndShop").onclick = function(){ openShop("scr_end"); };
$("btnShopBack").onclick = function(){
  if (shopFrom === "scr_end") showEnd();
  else if (shopFrom === "scr_game" && good && save.doneToday < save.goal) show("scr_game");
  else show("scr_start");
};
$("tabShop").onclick = function(){ shopTab = "shop"; renderShop(); };
$("tabCloset").onclick = function(){ shopTab = "closet"; renderShop(); };

function renderShop(){
  renderAvatar();
  $("tabShop").className = "btn " + (shopTab === "shop" ? "mid" : "tab-off");
  $("tabCloset").className = "btn " + (shopTab === "closet" ? "mid" : "tab-off");
  var c = getCloset();
  var grid = $("shopGrid"); grid.innerHTML = "";
  var list = shopTab === "shop" ? ITEMS : ITEMS.filter(function(it){ return c.owned.indexOf(it.id) >= 0; });
  if (shopTab === "shop") {
    $("shopMsg").textContent = "별 " + getWallet().stars + "개로 살 수 있어요!";
  } else {
    $("shopMsg").textContent = list.length ? "눌러서 갈아입어요!" : "아직 옷장이 비어 있어요. 상점에서 사 보세요!";
  }
  list.forEach(function(it){
    var owned = c.owned.indexOf(it.id) >= 0;
    var wearing = (c.wearing || {})[it.part] === it.id;
    var b = document.createElement("button");
    b.className = "shopitem" + (owned ? " owned" : "") + (wearing ? " wearing" : "");
    b.innerHTML = "<div class='em'>" + it.em + "</div><div class='nm'>" + it.nm + "</div>" +
      "<div class='pr'>" + (shopTab === "shop"
        ? (owned ? "옷장에 있어요" : "⭐ " + it.price)
        : (wearing ? "입는 중" : "입어 보기")) + "</div>";
    b.onclick = function(){ shopTab === "shop" ? tryBuy(it) : toggleWear(it); };
    grid.appendChild(b);
  });
}
function tryBuy(it){
  var c = getCloset();
  if (c.owned.indexOf(it.id) >= 0) { toggleWear(it); return; }
  var w = getWallet();
  if (w.stars < it.price) {
    var lack = it.price - w.stars;
    var m = "별이 아직 " + lack + "개 모자라요. 조금만 더 모아 볼까요?";
    sfxHint(); $("shopMsg").textContent = m; speak(m);
    return;
  }
  if (!spendStars(it.price)) return; /* 상점 구매: stars만 감소 */
  c = getCloset();
  if (c.owned.indexOf(it.id) < 0) c.owned.push(it.id);
  if (!c.wearing) c.wearing = {};
  c.wearing[it.part] = it.id; /* 사자마자 입어 보기 */
  putCloset(c);
  sfxGood();
  speak(it.nm + " 샀어요! 정말 잘 어울려요!");
  renderShop(); updateHud();
}
function toggleWear(it){
  var c = getCloset();
  if (c.owned.indexOf(it.id) < 0) return;
  if (!c.wearing) c.wearing = {};
  if (c.wearing[it.part] === it.id) { delete c.wearing[it.part]; speak(it.nm + " 벗었어요."); }
  else { c.wearing[it.part] = it.id; speak(it.nm + " 입었어요!"); }
  putCloset(c);
  sfxGood();
  renderShop(); updateHud();
}

/* ---------- 시작·코드 ---------- */
$("btnStart").onclick = function(){
  _ctx(); /* 소리 잠금 해제 */
  sfxGood();
  resetDaily();
  if (save.doneToday >= save.goal) { showEnd(); return; }
  nextCustomer();
};
function openCodeView(){
  $("codeOut").textContent = makeCode(Math.min(save.served,31), Math.min(save.doneToday,31));
  $("ov_codeview").classList.add("on");
}
$("btnShowCode").onclick = openCodeView;
$("btnEndCode").onclick = openCodeView;
$("btnCodeViewClose").onclick = function(){ $("ov_codeview").classList.remove("on"); };
$("btnEnterCode").onclick = function(){ $("codeIn").value = ""; $("ov_codein").classList.add("on"); };
$("btnCodeInClose").onclick = function(){ $("ov_codein").classList.remove("on"); };
$("btnCodeApply").onclick = function(){
  var r = applyCode($("codeIn").value, function(m){ return window.confirm(m); });
  if (r === "ok") {
    $("ov_codein").classList.remove("on");
    updateHud();
    alert("코드를 불러왔어요! 이어서 놀 수 있어요.");
  } else if (r === "bad") {
    alert("코드를 다시 확인해 주세요. 글자가 틀린 것 같아요.");
  }
};

/* ---------- 부모 설정 (톱니 → 7+8 확인) ---------- */
$("btnGear").onclick = function(){ $("gateInput").value = ""; $("ov_gate").classList.add("on"); };
$("btnGateNo").onclick = function(){ $("ov_gate").classList.remove("on"); };
$("btnGateOk").onclick = function(){
  if (parseInt($("gateInput").value, 10) === 15) {
    $("ov_gate").classList.remove("on");
    $("setMode").value = save.mode;
    $("setGoal").value = save.goal;
    show("scr_parent");
  } else {
    alert("정답이 아니에요. 부모님께 물어보세요!");
  }
};
$("btnParentClose").onclick = function(){
  save.mode = $("setMode").value;
  var g = parseInt($("setGoal").value, 10);
  if (g >= 1 && g <= 20) save.goal = g;
  putSave(save);
  if (save.doneToday >= save.goal) showEnd();
  else nextCustomer();
};

updateHud();
</script>
</body>
</html>
