<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>우리집 오락실</title>
<style>
:root{--bg:#1a1040;--neon:#ffd93d;--pink:#ff6ec7;--cyan:#4dd8ff;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:linear-gradient(180deg,#1a1040,#2d1b69);min-height:100vh;color:#fff;padding-bottom:40px;}
.marquee{background:linear-gradient(90deg,#ff6ec7,#ffd93d,#4dd8ff,#ff6ec7);background-size:300% 100%;animation:mq 6s linear infinite;padding:4px;}
@keyframes mq{to{background-position:300% 0;}}
.sign{background:#12093a;border-radius:0 0 24px 24px;text-align:center;padding:18px 10px 14px;}
h1{font-size:clamp(26px,7vw,40px);color:var(--neon);text-shadow:0 0 12px rgba(255,217,61,.7),0 0 30px rgba(255,110,199,.5);letter-spacing:2px;}
.sub{color:#cbb8ff;font-size:14px;margin-top:4px;}
.wallet{display:flex;justify-content:center;align-items:center;gap:8px;margin:16px auto 4px;background:rgba(255,255,255,.1);border:2px solid var(--neon);border-radius:999px;width:max-content;padding:8px 22px;font-size:22px;font-weight:bold;}
.wallet .n{color:var(--neon);font-size:28px;}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;max-width:480px;margin:18px auto;padding:0 14px;}
a.cab{display:block;text-decoration:none;color:#fff;background:linear-gradient(180deg,#3b2a86,#241556);border:3px solid #5b43c0;border-radius:20px;padding:16px 8px 14px;text-align:center;box-shadow:0 6px 0 #150b38;transition:transform .1s;}
a.cab:active{transform:translateY(4px);box-shadow:0 2px 0 #150b38;}
a.cab .ico{font-size:44px;display:block;filter:drop-shadow(0 0 8px rgba(255,255,255,.35));}
a.cab .nm{display:block;font-size:16px;font-weight:bold;margin-top:8px;}
a.cab .tag{display:block;font-size:11px;color:#b7a6ff;margin-top:3px;}
.codes{display:flex;gap:10px;justify-content:center;margin:10px auto 0;padding:0 14px;max-width:480px;}
.codes button{flex:1;font-size:15px;font-weight:bold;padding:14px 6px;border:none;border-radius:14px;cursor:pointer;color:#12093a;background:linear-gradient(180deg,#ffe98a,#ffd93d);box-shadow:0 4px 0 #b8992a;}
.codes button:active{transform:translateY(3px);box-shadow:none;}
dialog{border:none;border-radius:20px;padding:22px;max-width:340px;width:90%;text-align:center;font-size:16px;}
dialog::backdrop{background:rgba(0,0,0,.6);}
.codebox{font-size:22px;font-weight:bold;letter-spacing:2px;background:#f2edff;border-radius:10px;padding:14px 6px;margin:12px 0;word-break:break-all;color:#2d1b69;}
dialog input{width:100%;font-size:20px;text-align:center;padding:10px;border:2px solid #5b43c0;border-radius:10px;margin:10px 0;text-transform:uppercase;}
dialog button{font-size:16px;font-weight:bold;padding:10px 18px;border:none;border-radius:10px;margin:4px;cursor:pointer;background:#5b43c0;color:#fff;}
dialog button.gray{background:#ccc;color:#333;}
.msg{min-height:20px;font-size:14px;color:#c0392b;}
.foot{text-align:center;color:#8f7cc9;font-size:12px;margin-top:22px;}
</style>
</head>
<body>
<div class="marquee"></div>
<div class="sign">
  <h1>🕹️ 우리집 오락실 🕹️</h1>
  <div class="sub">누르면 게임이 시작돼요!</div>
</div>
<div class="wallet">⭐ <span class="n" id="stars">0</span> 개</div>
<div class="codes">
  <button onclick="showCode()">📤 이어하기 코드 보기</button>
  <button onclick="askCode()">📥 코드 입력</button>
</div>
<div class="grid">
  <a class="cab" href="dino1/"><span class="ico">🦖</span><span class="nm">공룡 숫자 사냥</span><span class="tag">숫자 세기</span></a>
  <a class="cab" href="dino2/"><span class="ico">🦕</span><span class="nm">공룡 기억력 카드</span><span class="tag">기억력</span></a>
  <a class="cab" href="hangul1/"><span class="ico">🎣</span><span class="nm">한글 낚시터</span><span class="tag">한글 낱말</span></a>
  <a class="cab" href="rocket1/"><span class="ico">🚀</span><span class="nm">우주선 덧셈 발사</span><span class="tag">덧셈</span></a>
  <a class="cab" href="riddle1/"><span class="ico">🎁</span><span class="nm">수수께끼 보물상자</span><span class="tag">생각 놀이</span></a>
  <a class="cab" href="mart1/"><span class="ico">🛒</span><span class="nm">마트 놀이 동전 계산</span><span class="tag">돈 계산</span></a>
  <a class="cab" href="train1/"><span class="ico">🚂</span><span class="nm">패턴 기차 잇기</span><span class="tag">패턴 찾기</span></a>
  <a class="cab" href="phonics1/"><span class="ico">🦜</span><span class="nm">파닉스 앵무새</span><span class="tag">영어 소리</span></a>
  <a class="cab" href="hangul2/"><span class="ico">🎙️</span><span class="nm">한글 아나운서</span><span class="tag">읽기 발표</span></a>
  <a class="cab" href="treasure1/"><span class="ico">🗺️</span><span class="nm">둘이서 보물지도</span><span class="tag">함께 놀기</span></a>
</div>
<div class="foot">별은 모든 게임에서 함께 모여요 ⭐</div>

<dialog id="dlgShow">
  <h3>내 이어하기 코드</h3>
  <div class="codebox" id="codeOut"></div>
  <div style="font-size:13px;color:#666;">종이에 적어 두면 다른 기기에서도<br>재산을 이어갈 수 있어요.</div>
  <button onclick="document.getElementById('dlgShow').close()">닫기</button>
</dialog>
<dialog id="dlgIn">
  <h3>코드 입력</h3>
  <input id="codeIn" placeholder="XXXX-XXXX-XXXX-XXX" maxlength="19">
  <div class="msg" id="inMsg"></div>
  <button onclick="doApply()">복원하기</button>
  <button class="gray" onclick="document.getElementById('dlgIn').close()">취소</button>
</dialog>
<script>
/* ============================================================
   공통 저장 라이브러리 v1 — 부록 A 공통 저장 규격 v2 구현
   모든 게임에 이 블록을 그대로 <script> 안에 붙여 넣는다.
   게임별로 바꾸는 것은 GAME_ID 한 줄뿐이다.
   ============================================================ */
var GAME_ID = "CHANGE_ME"; // 예: "dino2" — 게임마다 이 줄만 변경

/* 세이브 코드 문자셋: 영문 대문자+숫자 32자, O·0·I·1 제외 */
var CS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

/* ---------- localStorage 안전 입출력 ---------- */
function lsGet(k, def) {
  try {
    var v = JSON.parse(localStorage.getItem(k));
    return (v && typeof v === "object") ? v : JSON.parse(JSON.stringify(def));
  } catch (e) { return JSON.parse(JSON.stringify(def)); }
}
function lsSet(k, obj) {
  try { localStorage.setItem(k, JSON.stringify(obj)); } catch (e) { /* 저장 실패해도 게임은 계속 */ }
}

/* ---------- 공용 4키 (있는 키는 절대 지우지 않고 읽어서 이어 씀) ---------- */
function getWallet()  { return lsGet("game_wallet",     {v:1, stars:0, total:0}); }
function getCloset()  { return lsGet("game_closet",     {v:1, owned:[], wearing:{}}); }
function getColl()    { return lsGet("game_collection", {v:1, badges:[], cards:[]}); }
function getSave(def) { return lsGet("game_save_" + GAME_ID, def || {}); }
function putWallet(w) { lsSet("game_wallet", w); }
function putCloset(c) { lsSet("game_closet", c); }
function putColl(c)   { lsSet("game_collection", c); }
function putSave(s)   { lsSet("game_save_" + GAME_ID, s); }

/* 별 획득: stars와 total을 함께 올린다. total은 절대 줄지 않는다 */
function addStars(n) {
  var w = getWallet(); w.stars += n; w.total += n; putWallet(w);
}
/* 별 사용(상점): stars만 줄인다. 부족하면 false */
function spendStars(n) {
  var w = getWallet(); if (w.stars < n) return false;
  w.stars -= n; putWallet(w); return true;
}
/* 뱃지·카드 획득(중복 방지) */
function addBadge(n) { var c = getColl(); if (c.badges.indexOf(n) < 0) { c.badges.push(n); putColl(c); } }
function addCard(n)  { var c = getColl(); if (c.cards.indexOf(n)  < 0) { c.cards.push(n);  putColl(c); } }

/* ---------- 세이브 코드 (15자: 데이터 14 + 검사 1, 4자마다 하이픈) ----------
   구성: stars(2) total(2) closet소유비트(3) badges비트(3) cards비트(2) 진행p1(1) 진행p2(1)
   숫자 2자 = 0~1023, 비트 3자 = 항목 1~15번, 비트 2자 = 항목 1~10번, 1자 = 0~31 */
function enc2(n) { n = Math.max(0, Math.min(1023, Math.round(n||0))); return CS[Math.floor(n/32)] + CS[n%32]; }
function dec2(s) { return CS.indexOf(s[0])*32 + CS.indexOf(s[1]); }
function encBits(arr, chars) { /* 번호 배열 -> chars글자 비트마스크 */
  var bits = 0;
  (arr||[]).forEach(function(x){ x = parseInt(x,10); if (x >= 1 && x <= chars*5) bits |= (1 << (x-1)); });
  var out = "";
  for (var i = chars-1; i >= 0; i--) out += CS[(bits >> (i*5)) & 31];
  return out;
}
function decBits(s) { /* 글자들 -> 번호 배열 */
  var bits = 0, i;
  for (i = 0; i < s.length; i++) bits = (bits << 5) | CS.indexOf(s[i]);
  var arr = [];
  for (i = 1; i <= s.length*5; i++) if (bits & (1 << (i-1))) arr.push(i);
  return arr;
}
function makeCode(p1, p2) {
  var w = getWallet(), c = getCloset(), k = getColl();
  var raw = enc2(w.stars) + enc2(w.total) + encBits(c.owned,3) + encBits(k.badges,3) + encBits(k.cards,2) + CS[Math.max(0,Math.min(31,p1||0))] + CS[Math.max(0,Math.min(31,p2||0))];
  var sum = 0; for (var i = 0; i < raw.length; i++) sum += CS.indexOf(raw[i]);
  raw += CS[sum % 32];
  return raw.replace(/(.{4})/g, "$1-").replace(/-$/, "");
}
function parseCode(str) {
  var raw = (str||"").toUpperCase().replace(/[^A-Z2-9]/g, "");
  if (raw.length !== 15) return null;
  var sum = 0, i, x;
  for (i = 0; i < 14; i++) { x = CS.indexOf(raw[i]); if (x < 0) return null; sum += x; }
  if (CS[sum % 32] !== raw[14]) return null; /* 검사 글자 불일치 = 오타 */
  return {
    stars:  dec2(raw.slice(0,2)),
    total:  dec2(raw.slice(2,4)),
    owned:  decBits(raw.slice(4,7)),
    badges: decBits(raw.slice(7,10)),
    cards:  decBits(raw.slice(10,12)),
    p1: CS.indexOf(raw[12]),
    p2: CS.indexOf(raw[13])
  };
}
/* 복원 적용: 재산이 지금보다 적으면 confirmFn(안내문)이 true일 때만 덮어씀.
   total은 어떤 경우에도 큰 값을 유지한다. 반환: "ok" | "cancel" | "bad" */
function applyCode(str, confirmFn) {
  var d = parseCode(str);
  if (!d) return "bad";
  var w = getWallet();
  if (d.total < w.total || d.stars < w.stars) {
    var msg = "입력한 코드의 재산(별 " + d.stars + "개)이 지금 기기(별 " + w.stars + "개)보다 적어요. 그래도 코드 쪽으로 되돌릴까요?";
    if (!confirmFn(msg)) return "cancel";
  }
  putWallet({v:1, stars:d.stars, total:Math.max(d.total, w.total)});
  var c = getCloset(); c.owned = d.owned; putCloset(c);
  putColl({v:1, badges:d.badges, cards:d.cards});
  return "ok";
}

/* ---------- 한국어 음성(TTS): 화면 첫 터치 후부터 동작 ---------- */
function speak(txt) {
  try {
    if (!window.speechSynthesis) return;
    var u = new SpeechSynthesisUtterance(txt);
    u.lang = "ko-KR"; u.rate = 0.9;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}
/* ---------- 효과음(WebAudio, 외부 파일 없음) ---------- */
var _ac = null;
function _ctx() { if (!_ac) { try { _ac = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} } return _ac; }
function beep(freq, dur, type) {
  var ac = _ctx(); if (!ac) return;
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = type || "sine"; o.frequency.value = freq;
  g.gain.setValueAtTime(0.25, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + (dur||0.15));
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + (dur||0.15));
}
function sfxGood()  { beep(660,0.12); setTimeout(function(){beep(880,0.12);},110); setTimeout(function(){beep(1320,0.2);},220); }
function sfxHint()  { beep(440,0.15,"triangle"); }
function sfxDone()  { [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){beep(f,0.18);}, i*140); }); }
/* ============================================================ */
GAME_ID = "arcade";
function refresh(){ document.getElementById("stars").textContent = getWallet().stars; }
function showCode(){
  document.getElementById("codeOut").textContent = makeCode(0,0);
  document.getElementById("dlgShow").showModal();
}
function askCode(){
  document.getElementById("inMsg").textContent = "";
  document.getElementById("codeIn").value = "";
  document.getElementById("dlgIn").showModal();
}
function doApply(){
  var r = applyCode(document.getElementById("codeIn").value, function(m){ return confirm(m); });
  var el = document.getElementById("inMsg");
  if (r === "bad") { el.textContent = "코드를 다시 확인해 주세요. 한 글자가 다른 것 같아요."; return; }
  if (r === "cancel") { el.textContent = "복원을 취소했어요."; return; }
  document.getElementById("dlgIn").close();
  refresh();
  alert("복원 완료! 별 " + getWallet().stars + "개를 이어받았어요.");
}
document.addEventListener("visibilitychange", function(){ if(!document.hidden) refresh(); });
refresh();
</script>
</body>
</html>
