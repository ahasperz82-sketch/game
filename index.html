<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공룡 숫자 세기</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;padding:0;}
body{
  font-family:'Apple SD Gothic Neo','Malgun Gothic','맑은 고딕',AppleGothic,'Noto Sans KR',sans-serif;
  color:#2b3550;background:#9fe4ff;overflow:hidden;
  -webkit-user-select:none;user-select:none;
}
#app{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;}

/* ===== 위쪽 지갑 바 ===== */
#topbar{
  flex:0 0 auto;display:flex;align-items:center;gap:10px;
  padding:8px 12px;background:linear-gradient(180deg,#fff6d5,#ffe9a8);
  box-shadow:0 3px 10px rgba(0,0,0,.15);z-index:60;position:relative;
}
#wallet{
  display:flex;align-items:center;gap:6px;background:#fff;border:4px solid #ffb703;
  border-radius:999px;padding:4px 16px 4px 10px;font-weight:900;font-size:26px;color:#e07b00;
  box-shadow:0 3px 0 #e59400;
}
#wallet .w-ico{font-size:26px;}
#wallet.pop{animation:walletPop .5s ease;}
@keyframes walletPop{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
#todayWrap{display:flex;align-items:center;gap:6px;flex:1 1 auto;flex-wrap:wrap;}
#todayLabel{font-weight:900;font-size:15px;color:#8a5a00;}
.goal-dot{width:26px;height:26px;font-size:20px;line-height:26px;text-align:center;
  filter:grayscale(1);opacity:.35;}
.goal-dot.on{filter:none;opacity:1;animation:walletPop .5s ease;}
#btnParent{
  flex:0 0 auto;border:none;background:rgba(255,255,255,.75);border-radius:12px;
  padding:6px 9px;font-size:12px;font-weight:800;color:#7a8299;cursor:pointer;
}
#saveWarn{display:none;position:absolute;right:8px;top:52px;background:#fff0f0;color:#c0392b;
  border:2px solid #ffb3b3;border-radius:10px;padding:4px 8px;font-size:12px;font-weight:800;z-index:70;}

/* ===== 화면 ===== */
#stage{flex:1 1 auto;position:relative;overflow:hidden;}
.screen{position:absolute;top:0;left:0;right:0;bottom:0;display:none;}
.screen.on{display:block;}

/* 들판 */
.field{
  position:absolute;top:0;left:0;right:0;bottom:0;
  background:linear-gradient(180deg,#7fd4ff 0%,#bdeeff 55%,#d8f7ff 62%);
  overflow:hidden;
}
.ground{position:absolute;left:0;right:0;bottom:0;height:26%;
  background:linear-gradient(180deg,#8fe06a 0%,#5cc23e 100%);
  border-top:8px solid #6fd050;}
.hill{position:absolute;bottom:22%;border-radius:50% 50% 0 0;background:#7fd85f;opacity:.85;}
.sun{position:absolute;top:14px;right:18px;width:74px;height:74px;border-radius:50%;
  background:radial-gradient(circle at 40% 40%,#fff3a8,#ffd53d);box-shadow:0 0 34px #ffe066;}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.9;}
.cloud:before,.cloud:after{content:'';position:absolute;background:#fff;border-radius:50%;}

/* 초대형 숫자 */
#bignum{
  position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);
  font-size:clamp(96px,30vw,240px);font-weight:900;line-height:1;
  color:#fff;-webkit-text-stroke:10px #ff8fbf;paint-order:stroke fill;
  text-shadow:0 10px 0 rgba(0,0,0,.10);
  z-index:2;pointer-events:none;transition:opacity .25s ease,transform .25s ease;
  opacity:.42;
}
#bignum.hit{opacity:1;animation:numPop .55s cubic-bezier(.2,1.6,.4,1);}
@keyframes numPop{0%{transform:translate(-50%,-50%) scale(.6)}60%{transform:translate(-50%,-50%) scale(1.18)}100%{transform:translate(-50%,-50%) scale(1)}}

/* 공룡 */
#dino{
  position:absolute;width:min(38vw,210px);height:min(38vw,210px);
  transform:translate(-50%,-50%);border:none;background:transparent;padding:0;margin:0;
  cursor:pointer;z-index:5;display:none;
}
#dino svg{width:100%;height:100%;display:block;filter:drop-shadow(0 8px 6px rgba(0,0,0,.18));}
#dino.show{display:block;animation:dinoIn .35s cubic-bezier(.2,1.7,.4,1),dinoIdle 1.6s ease-in-out .4s infinite;}
@keyframes dinoIn{0%{transform:translate(-50%,-50%) scale(0) rotate(-25deg)}70%{transform:translate(-50%,-50%) scale(1.15) rotate(6deg)}100%{transform:translate(-50%,-50%) scale(1) rotate(0)}}
@keyframes dinoIdle{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-52%) scale(1.03)}}
#dino.jump{animation:dinoJump .75s cubic-bezier(.3,1.4,.4,1) forwards !important;}
@keyframes dinoJump{
  0%{transform:translate(-50%,-50%) scale(1) rotate(0)}
  30%{transform:translate(-50%,-92%) scale(1.12) rotate(-12deg)}
  55%{transform:translate(-50%,-46%) scale(.95) rotate(6deg)}
  75%{transform:translate(-50%,-78%) scale(1.06) rotate(-4deg)}
  100%{transform:translate(-50%,-50%) scale(0) rotate(12deg);opacity:0}
}
.spark{position:absolute;font-size:34px;pointer-events:none;z-index:6;animation:sparkGo .7s ease-out forwards;}
@keyframes sparkGo{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.3);opacity:0}}

/* 아래 진행바 */
#roundbar{position:absolute;left:5%;right:5%;bottom:12px;height:22px;background:rgba(255,255,255,.6);
  border-radius:999px;overflow:hidden;z-index:4;border:3px solid #fff;}
#roundfill{height:100%;width:0%;background:linear-gradient(90deg,#ffd93d,#ff8fbf);transition:width .35s ease;}
#roundtxt{position:absolute;left:0;right:0;bottom:14px;text-align:center;font-size:14px;font-weight:900;
  color:#3f4a63;z-index:5;}

/* ===== 버튼 ===== */
.btn{
  border:none;border-radius:26px;padding:20px 26px;font-size:26px;font-weight:900;
  background:linear-gradient(180deg,#ffd166,#ffa62b);color:#5a3200;cursor:pointer;
  box-shadow:0 7px 0 #e07b00,0 10px 18px rgba(0,0,0,.18);min-height:76px;
  font-family:inherit;
}
.btn:active{transform:translateY(5px);box-shadow:0 2px 0 #e07b00;}
.btn.big{font-size:38px;padding:26px 44px;min-height:104px;border-radius:34px;}
.btn.pink{background:linear-gradient(180deg,#ffb3d9,#ff77b8);color:#7a0044;box-shadow:0 7px 0 #d95093,0 10px 18px rgba(0,0,0,.18);}
.btn.blue{background:linear-gradient(180deg,#a8e0ff,#5cc0f5);color:#04406b;box-shadow:0 7px 0 #3d95c7,0 10px 18px rgba(0,0,0,.18);}
.btn.green{background:linear-gradient(180deg,#b6f09c,#6fd44e);color:#14520a;box-shadow:0 7px 0 #4fa832,0 10px 18px rgba(0,0,0,.18);}
.btn.gray{background:linear-gradient(180deg,#e8ecf3,#cfd6e2);color:#4a5468;box-shadow:0 6px 0 #a9b3c4;}
.btn.small{font-size:19px;padding:14px 18px;min-height:58px;border-radius:18px;}

/* 시작 화면 */
#screen-start .inner{
  position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;padding:14px;text-align:center;z-index:5;
  overflow-y:auto;
}
#title{font-size:clamp(34px,9vw,62px);font-weight:900;color:#fff;-webkit-text-stroke:8px #4aa9d8;
  paint-order:stroke fill;margin:0;line-height:1.15;}
#subtitle{font-size:19px;font-weight:800;color:#2f6d8f;margin:0;}
.rowbtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}
#startDino{width:min(34vw,150px);}

/* 끝 화면 */
#screen-end .inner{
  position:absolute;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:16px;padding:16px;text-align:center;
  background:linear-gradient(180deg,#ffd9ec,#fff3c4);overflow-y:auto;
}
#endTitle{font-size:clamp(30px,8vw,54px);font-weight:900;color:#fff;-webkit-text-stroke:8px #ff77b8;
  paint-order:stroke fill;margin:0;line-height:1.2;}
#endStars{font-size:44px;letter-spacing:4px;}

/* ===== 오버레이 공통 ===== */
.overlay{position:fixed;top:0;left:0;right:0;bottom:0;z-index:200;display:none;
  align-items:center;justify-content:center;padding:14px;background:rgba(20,30,50,.55);}
.overlay.on{display:flex;}
.card{background:#fff;border-radius:30px;padding:22px 18px;width:100%;max-width:520px;
  box-shadow:0 18px 40px rgba(0,0,0,.3);text-align:center;max-height:94%;overflow-y:auto;}

/* 깜짝 문제 */
#quizOverlay .card{background:linear-gradient(180deg,#fffbe8,#ffeff6);}
#quizQ{font-size:clamp(24px,6.5vw,36px);font-weight:900;margin:4px 0 6px;color:#c2185b;}
#quizMsg{font-size:19px;font-weight:800;color:#4a5468;min-height:26px;margin-bottom:10px;}
#quizOpts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.opt{
  border:none;border-radius:28px;width:min(27vw,140px);height:min(27vw,140px);
  font-size:clamp(40px,11vw,64px);font-weight:900;cursor:pointer;font-family:inherit;
  background:linear-gradient(180deg,#a8e0ff,#5cc0f5);color:#04406b;
  box-shadow:0 8px 0 #3d95c7,0 12px 20px rgba(0,0,0,.2);transition:opacity .3s,transform .2s;
}
.opt:active{transform:translateY(5px);box-shadow:0 3px 0 #3d95c7;}
.opt.gone{opacity:.15;pointer-events:none;transform:scale(.8) rotate(-8deg);}
.opt.bad{animation:shake .5s;background:linear-gradient(180deg,#ffd0d0,#ff9d9d);color:#8b1e1e;box-shadow:0 8px 0 #d97070;}
.opt.good{background:linear-gradient(180deg,#b6f09c,#6fd44e);color:#14520a;box-shadow:0 8px 0 #4fa832;animation:goodPop .6s;}
.opt.point{animation:pointBounce 1s ease-in-out infinite;}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(12px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}
@keyframes goodPop{0%{transform:scale(1)}45%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes pointBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
#quizDino{width:120px;margin:6px auto 0;}
#quizDino.jump{animation:qJump .7s cubic-bezier(.3,1.4,.4,1);}
@keyframes qJump{0%,100%{transform:translateY(0) rotate(0)}35%{transform:translateY(-42px) rotate(-12deg)}70%{transform:translateY(-14px) rotate(6deg)}}

/* 축하 */
#celebOverlay .card{background:linear-gradient(180deg,#fff8d8,#ffe0f0);}
#celebTitle{font-size:clamp(30px,8vw,50px);font-weight:900;color:#fff;-webkit-text-stroke:7px #ffa62b;
  paint-order:stroke fill;margin:6px 0;}
#celebStar{font-size:96px;animation:starSpin 1.1s ease;}
@keyframes starSpin{0%{transform:scale(0) rotate(-180deg)}60%{transform:scale(1.35) rotate(20deg)}100%{transform:scale(1) rotate(0)}}
.confetti{position:fixed;top:-30px;width:14px;height:20px;z-index:190;pointer-events:none;
  animation:fall linear forwards;border-radius:3px;}
@keyframes fall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:.9}}

/* 날아가는 별 */
.fly-star{position:fixed;font-size:52px;z-index:300;pointer-events:none;
  transition:transform .9s cubic-bezier(.4,0,.5,1),opacity .9s ease-in;
  transform:translate(-50%,-50%) scale(1);}

/* 모달(부모용) */
#modalOverlay .card{text-align:left;}
.mtitle{font-size:24px;font-weight:900;margin:0 0 12px;text-align:center;color:#2b3550;}
.mrow{margin:14px 0;}
.mlabel{font-size:17px;font-weight:900;color:#4a5468;margin-bottom:8px;}
.chips{display:flex;gap:8px;flex-wrap:wrap;}
.chip{border:3px solid #cfd6e2;background:#fff;border-radius:16px;padding:12px 16px;font-size:19px;
  font-weight:900;color:#4a5468;cursor:pointer;font-family:inherit;min-width:64px;}
.chip.sel{border-color:#ff8fbf;background:#ffeaf4;color:#c2185b;}
.mfoot{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap;}
.codebox{font-family:'Courier New',monospace;font-size:clamp(20px,6vw,30px);font-weight:900;
  letter-spacing:2px;text-align:center;background:#f3f7ff;border:3px dashed #a8c4ff;border-radius:16px;
  padding:14px 8px;color:#1d3a7a;word-break:break-all;width:100%;}
.hint{font-size:14px;color:#7a8299;line-height:1.6;margin-top:10px;text-align:center;}
input.tin{width:100%;font-size:26px;font-weight:900;padding:14px;border:3px solid #cfd6e2;border-radius:16px;
  text-align:center;font-family:'Courier New',monospace;letter-spacing:2px;}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;}
.keypad button{font-size:26px;font-weight:900;padding:16px 0;border:none;border-radius:16px;
  background:#eef2f8;color:#2b3550;cursor:pointer;font-family:inherit;box-shadow:0 4px 0 #c9d2e0;}
.keypad button:active{transform:translateY(3px);box-shadow:0 1px 0 #c9d2e0;}
.gate-q{font-size:44px;font-weight:900;text-align:center;margin:10px 0;color:#2b3550;}
.gate-a{font-size:40px;font-weight:900;text-align:center;letter-spacing:4px;min-height:52px;color:#c2185b;}
.err{color:#c0392b;font-weight:900;text-align:center;font-size:16px;min-height:22px;}
</style>
</head>
<body>
<div id="app">

  <div id="topbar">
    <div id="wallet"><span class="w-ico">⭐</span><span id="walletStars">0</span></div>
    <div id="todayWrap"><span id="todayLabel">오늘의 별</span><span id="goalDots"></span></div>
    <button id="btnParent" type="button">부모설정</button>
    <div id="saveWarn">저장이 안 되고 있어요(게임은 계속돼요)</div>
  </div>

  <div id="stage">

    <!-- 시작 화면 -->
    <section id="screen-start" class="screen on">
      <div class="field">
        <div class="sun"></div>
        <div class="cloud" style="left:8%;top:12%;width:90px;height:34px;"></div>
        <div class="cloud" style="left:60%;top:26%;width:70px;height:26px;"></div>
        <div class="hill" style="left:-10%;width:60%;height:26%;"></div>
        <div class="hill" style="right:-12%;width:55%;height:20%;"></div>
        <div class="ground"></div>
      </div>
      <div class="inner">
        <div id="startDino"></div>
        <h1 id="title">공룡 숫자 세기</h1>
        <p id="subtitle">공룡을 눌러서 하나씩 세어 봐요!</p>
        <button id="btnStart" class="btn big green" type="button">시작하기</button>
        <div class="rowbtns">
          <button id="btnShowCode" class="btn small blue" type="button">이어하기 코드 보기</button>
          <button id="btnEnterCode" class="btn small gray" type="button">코드 입력</button>
        </div>
      </div>
    </section>

    <!-- 놀이 화면 -->
    <section id="screen-play" class="screen">
      <div class="field">
        <div class="sun"></div>
        <div class="cloud" style="left:6%;top:9%;width:96px;height:34px;"></div>
        <div class="cloud" style="left:52%;top:20%;width:74px;height:28px;"></div>
        <div class="hill" style="left:-8%;width:58%;height:24%;"></div>
        <div class="hill" style="right:-10%;width:52%;height:18%;"></div>
        <div class="ground"></div>
        <div id="bignum">0</div>
        <button id="dino" type="button" aria-label="공룡 잡기"></button>
        <div id="roundtxt"></div>
        <div id="roundbar"><div id="roundfill"></div></div>
      </div>
    </section>

    <!-- 끝 화면 -->
    <section id="screen-end" class="screen">
      <div class="inner">
        <div style="width:min(40vw,170px)" id="endDino"></div>
        <h1 id="endTitle">오늘은 여기까지!<br>내일 또 만나!</h1>
        <div id="endStars">⭐⭐⭐⭐⭐</div>
        <p id="endMsg" style="font-size:20px;font-weight:800;color:#8a4a6a;margin:0;"></p>
        <button id="btnEndCode" class="btn small blue" type="button">이어하기 코드 보기</button>
        <p class="hint">더 놀고 싶으면 어른에게 [부모설정]을 부탁해요.</p>
      </div>
    </section>

  </div>
</div>

<!-- 깜짝 문제 -->
<div id="quizOverlay" class="overlay">
  <div class="card">
    <div id="quizQ">지금까지 몇 마리 잡았게?</div>
    <div id="quizMsg">하나 골라 봐!</div>
    <div id="quizOpts"></div>
    <div id="quizDino"></div>
  </div>
</div>

<!-- 축하 -->
<div id="celebOverlay" class="overlay">
  <div class="card">
    <div id="celebTitle">참 잘했어요!</div>
    <div id="celebStar">⭐</div>
    <div id="celebMsg" style="font-size:22px;font-weight:900;color:#7a4a00;margin:10px 0 18px;"></div>
    <button id="btnCelebNext" class="btn big pink" type="button">계속!</button>
  </div>
</div>

<!-- 부모/코드 모달 -->
<div id="modalOverlay" class="overlay"><div class="card" id="modalCard"></div></div>

<script>
"use strict";
/* =========================================================
   공룡 숫자 세기 (게임ID: dino1) - 단일 HTML, 오프라인 동작
   ========================================================= */

/* ---------- 짧은 도우미 ---------- */
function $(s){return document.querySelector(s);}
function el(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e;}
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function clampInt(v,min,max,def){v=parseInt(v,10);if(isNaN(v))v=(def==null?min:def);return Math.max(min,Math.min(max,v));}
function todayStr(){var d=new Date();var m=d.getMonth()+1,dd=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(dd<10?'0':'')+dd;}

/* ---------- 저장소 (공통 규칙) ---------- */
var WALLET_KEY='game_wallet', CLOSET_KEY='game_closet', COLL_KEY='game_collection';
var GAME_ID='dino1', SAVE_KEY='game_save_'+GAME_ID;

function lsGet(k){
  try{var s=localStorage.getItem(k);if(!s)return null;var o=JSON.parse(s);
      return (o&&typeof o==='object')?o:null;}catch(e){return null;}
}
function lsSet(k,o){
  try{localStorage.setItem(k,JSON.stringify(o));return true;}
  catch(e){ $('#saveWarn').style.display='block'; return false; }   /* 저장 실패해도 게임은 계속 */
}
/* 기존 키는 지우지 않고 읽어서 이어 쓴다 (알 수 없는 필드도 그대로 보존) */
function getWallet(){
  var w=lsGet(WALLET_KEY)||{}, out={};
  for(var k in w){ if(Object.prototype.hasOwnProperty.call(w,k)) out[k]=w[k]; }
  out.v = out.v || 1;
  out.stars = Math.max(0, Math.floor(Number(w.stars))||0);
  out.total = Math.max(0, Math.floor(Number(w.total))||0);
  if(out.total < out.stars) out.total = out.stars;   /* total은 절대 stars보다 작을 수 없음 */
  return out;
}
function saveWallet(w){ w.v=w.v||1; return lsSet(WALLET_KEY,w); }
function getCloset(){
  var c=lsGet(CLOSET_KEY)||{}, out={};
  for(var k in c){ if(Object.prototype.hasOwnProperty.call(c,k)) out[k]=c[k]; }
  out.v=out.v||1;
  out.owned = Array.isArray(c.owned)? c.owned.slice() : [];
  out.wearing = (c.wearing && typeof c.wearing==='object')? c.wearing : {};
  return out;
}
function getCollection(){
  var c=lsGet(COLL_KEY)||{}, out={};
  for(var k in c){ if(Object.prototype.hasOwnProperty.call(c,k)) out[k]=c[k]; }
  out.v=out.v||1;
  out.badges = Array.isArray(c.badges)? c.badges.slice() : [];
  out.cards  = Array.isArray(c.cards) ? c.cards.slice()  : [];
  return out;
}
/* 없을 때만 만들어 둔다(있으면 절대 덮어쓰지 않음) */
function ensureSharedKeys(){
  if(!lsGet(WALLET_KEY)) lsSet(WALLET_KEY,{v:1,stars:0,total:0});
  if(!lsGet(CLOSET_KEY)) lsSet(CLOSET_KEY,{v:1,owned:[],wearing:{}});
  if(!lsGet(COLL_KEY))   lsSet(COLL_KEY,{v:1,badges:[],cards:[]});
}

/* ---------- 이 게임 진행 상황 ---------- */
var RANGES=[10,20,30,50];
var S=null;
function loadState(){
  var d=lsGet(SAVE_KEY)||{};
  var ds=(d.settings&&typeof d.settings==='object')?d.settings:{};
  var st={
    v:1,
    date: (typeof d.date==='string')? d.date : todayStr(),
    todayStars: clampInt(d.todayStars,0,999,0),

  if(st.date!==todayStr()){ st.date=todayStr(); st.todayStars=0; st.count=0; st.sinceQuiz=0; }

/* ---------- 이어하기 코드 ---------- */
/* O·0·I·1 을 뺀 32글자, 4자마다 '-', 마지막 1자는 검사 글자 → 19자 */
var B32='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function toBits(v,len){
  v=Math.floor(Number(v))||0; if(v<0)v=0;
  var max=Math.pow(2,len)-1; if(v>max)v=max;
  var s=v.toString(2); while(s.length<len)s='0'+s; return s;
}
function maskFrom(arr,bits){
  var m=0; for(var i=0;i<arr.length;i++){ var n=parseInt(arr[i],10); if(n>=1&&n<=bits) m|=(1<<(n-1)); } return m;
}
function maskTo(m,bits){ var a=[]; for(var i=0;i<bits;i++){ if(m&(1<<i)) a.push(i+1); } return a; }
/* 부록A 규격: wearing 부위 키는 영문(hat/clothes). 한글 키로 저장된 옛 데이터도 읽어 준다.
   신발 등 여기서 다루지 않는 부위는 건드리지 않고 그대로 보존한다. */
var SLOTS=[['hat','모자'],['clothes','옷','clothing']];
function wearVal(wearing,names){
  for(var i=0;i<names.length;i++){ var n=parseInt(wearing[names[i]],10); if(n>=1&&n<=15) return n; }
  return 0;
}

function buildCode(){
  var w=getWallet(), c=getCloset(), col=getCollection();
  var bits='';
  bits+=toBits(1,3);                          /* 버전 */
  bits+=toBits(w.stars,11);                   /* 지갑 별 */
  bits+=toBits(w.total,13);                   /* 모은 별 총합 */
  bits+=toBits(maskFrom(c.owned,12),12);      /* 옷장 1~12 */
  bits+=toBits(wearVal(c.wearing,SLOTS[0]),4);
  bits+=toBits(wearVal(c.wearing,SLOTS[1]),4);
  bits+=toBits(maskFrom(col.badges,10),10);   /* 도감 배지 1~10 */
  bits+=toBits(maskFrom(col.cards,10),10);    /* 도감 카드 1~10 */
  bits+=toBits(S.roundsCleared,5);            /* dino1 판 수 */
  bits+=toBits(RANGES.indexOf(S.settings.range),2);
  bits+=toBits(S.settings.quiz?1:0,1);        /* 합계 75비트 = 15글자 */
  var chars=[],i;
  for(i=0;i<75;i+=5) chars.push(B32.charAt(parseInt(bits.substr(i,5),2)));
  var sum=0; for(i=0;i<chars.length;i++) sum+=(i+1)*B32.indexOf(chars[i]);
  chars.push(B32.charAt(sum%32));             /* 검사 글자 */
  return chars.join('').replace(/(.{4})(?=.)/g,'$1-');   /* XXXX-XXXX-XXXX-XXXX (19자) */
}
function parseCode(str){
  var s=String(str||'').toUpperCase().replace(/[^A-Z0-9]/g,''),i;
  if(s.length!==16) return null;
  for(i=0;i<16;i++){ if(B32.indexOf(s.charAt(i))<0) return null; }
  var sum=0; for(i=0;i<15;i++) sum+=(i+1)*B32.indexOf(s.charAt(i));
  if(B32.indexOf(s.charAt(15))!==(sum%32)) return null;   /* 오타 검증 */
  var bits=''; for(i=0;i<15;i++) bits+=toBits(B32.indexOf(s.charAt(i)),5);
  var p=0;
  function rd(n){ var v=parseInt(bits.substr(p,n),2); p+=n; return v; }
  var v=rd(3); if(v!==1) return null;
  var d={};
  d.stars=rd(11); d.total=rd(13);
  d.owned=maskTo(rd(12),12);
  d.wear0=rd(4); d.wear1=rd(4);
  d.badges=maskTo(rd(10),10);
  d.cards=maskTo(rd(10),10);
  d.rounds=rd(5);
  var ri=rd(2); d.range=RANGES[ri]||10;
  d.quiz=!!rd(1);
  if(d.total<d.stars) d.total=d.stars;
  return d;
}
function applyCode(d){
  /* 재산(별)은 절대 줄지 않게: 기존과 합쳐서 큰 값 사용 */
  var w=getWallet();
  w.stars=Math.max(w.stars,d.stars); w.total=Math.max(w.total,d.total,w.stars);
  saveWallet(w);
  var c=getCloset();
  for(var i=0;i<d.owned.length;i++){ if(c.owned.indexOf(d.owned[i])<0) c.owned.push(d.owned[i]); }
  if(d.wear0) c.wearing[SLOTS[0][0]]=d.wear0;
  if(d.wear1) c.wearing[SLOTS[1][0]]=d.wear1;
  lsSet(CLOSET_KEY,c);
  var col=getCollection();
  for(i=0;i<d.badges.length;i++){ if(col.badges.indexOf(d.badges[i])<0) col.badges.push(d.badges[i]); }
  for(i=0;i<d.cards.length;i++){ if(col.cards.indexOf(d.cards[i])<0) col.cards.push(d.cards[i]); }
  lsSet(COLL_KEY,col);
  S.roundsCleared=Math.max(S.roundsCleared,d.rounds);
  S.settings.range=d.range; S.settings.quiz=d.quiz;
  if(S.count>=S.settings.range) S.count=0;
  saveState(); renderWallet(); renderStart();
}

var AC=null;
function actx(){
  try{
    if(!AC){ var C=window.AudioContext||window.webkitAudioContext; if(!C) return null; AC=new C(); }
    if(AC.state==='suspended') AC.resume();
  }catch(e){ AC=null; }
  return AC;
}
function tone(freq,at,dur,type,vol){
  var a=actx(); if(!a) return;
  try{
    var o=a.createOscillator(), g=a.createGain(), t=a.currentTime+at;
    o.type=type||'triangle'; o.frequency.setValueAtTime(freq,t);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.25,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.05);
  }catch(e){}
}
function seq(list,type,vol){ for(var i=0;i<list.length;i++) tone(list[i][0],list[i][1],list[i][2]||0.18,type,vol); }
function sfxCatch(){ seq([[660,0],[988,0.07]],'triangle',0.22); }
function sfxStar(){ seq([[784,0],[988,0.08],[1319,0.16,0.3]],'triangle',0.22); }

function sfxGood(){ seq([[659,0],[784,0.08],[988,0.16],[1319,0.26,0.35]],'triangle',0.24); }
function sfxSoft(){ seq([[392,0,0.16],[311,0.13,0.22]],'sine',0.18); }
function sfxFanfare(){ seq([[523,0],[659,0.12],[784,0.24],[1047,0.36,0.5],[1319,0.52,0.6]],'triangle',0.26); }

var koVoice=null;
function pickVoice(){
  try{
    if(!('speechSynthesis' in window)) return;
    var vs=window.speechSynthesis.getVoices()||[];
    for(var i=0;i<vs.length;i++){ if(/^ko/i.test(vs[i].lang||'')){ koVoice=vs[i]; return; } }
  }catch(e){}
}
try{ if('speechSynthesis' in window){ pickVoice(); window.speechSynthesis.onvoiceschanged=pickVoice; } }catch(e){}
function speak(text){
  try{
    if(!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang='ko-KR'; if(koVoice) u.voice=koVoice;
    u.rate=0.95; u.pitch=1.25; u.volume=1;
    window.speechSynthesis.speak(u);
  }catch(e){}
}
var ONES=['','하나','둘','셋','넷','다섯','여섯','일곱','여덟','아홉'];
var TENS=['','열','스물','서른','마흔','쉰'];
var ONES_U=['','한','두','세','네','다섯','여섯','일곱','여덟','아홉'];
function korCount(n){ var t=Math.floor(n/10),o=n%10; if(n<=0)return String(n); if(t===0)return ONES[o]; return (TENS[t]||'')+ONES[o]; }
function korUnit(n){
  var t=Math.floor(n/10),o=n%10; if(n<=0)return String(n);
  if(t===0) return ONES_U[o];
  var T=(t===2)?(o===0?'스무':'스물'):(TENS[t]||'');
  return T+ONES_U[o];
}

/* ---------- 깜짝 문제 ---------- */
var Q=null;
function startQuiz(answer,roundPending){
  Q={ans:answer,attempt:1,pending:roundPending};
  var opts=[answer], cands=[answer-2,answer-1,answer+1,answer+2,answer+3];
  /* 보기 2개 더 만들기 */
  var pool=[];
  for(var i=0;i<cands.length;i++){ if(cands[i]>=1&&cands[i]!==answer&&pool.indexOf(cands[i])<0) pool.push(cands[i]); }
  while(opts.length<3&&pool.length){ opts.push(pool.splice(rand(0,pool.length-1),1)[0]); }
  while(opts.length<3){ var extra=answer+opts.length+2; if(opts.indexOf(extra)<0) opts.push(extra); }
  for(i=opts.length-1;i>0;i--){ var j=rand(0,i), t=opts[i]; opts[i]=opts[j]; opts[j]=t; }

  var box=$('#quizOpts'); box.innerHTML='';
  for(i=0;i<opts.length;i++){
    (function(val){
      var b=el('button','opt',String(val));
      b.type='button';
      b.onclick=function(){ onQuizPick(val,b); };
      box.appendChild(b);
    })(opts[i]);
  }
  $('#quizMsg').textContent='하나 골라 봐!';
  $('#quizDino').innerHTML=dinoSVG(PALETTE[rand(0,PALETTE.length-1)]);
  $('#quizOverlay').classList.add('on');
  sfxQuiz();
  setTimeout(function(){ speak('지금까지 몇 마리 잡았게?'); },350);
}
function quizDinoJump(){
  var d=$('#quizDino'); d.classList.remove('jump'); void d.offsetWidth; d.classList.add('jump');
}
function onQuizPick(val,btn){
  if(!Q) return;
  if(val===Q.ans){
    btn.className='opt good';
    var opts=document.querySelectorAll('#quizOpts .opt');
    for(var i=0;i<opts.length;i++){ if(opts[i]!==btn) opts[i].className='opt gone'; }
    var reward = (Q.attempt===1)?2:((Q.attempt===2)?1:0);
    sfxGood(); quizDinoJump();
    if(reward===2){ $('#quizMsg').textContent='한 번에 맞혔어! 별 2개!'; speak('정답이야! 별 두 개!'); }
    else if(reward===1){ $('#quizMsg').textContent='잘했어! 별 1개!'; speak('맞았어! 별 한 개!'); }
    else { $('#quizMsg').textContent='잘 눌렀어! 다음엔 맞힐 수 있어!'; speak(korUnit(Q.ans)+' 마리 맞아. 잘했어!'); }
    if(reward>0) setTimeout(function(){ awardStars(reward,btn); },350);
    setTimeout(endQuiz, reward>0? 1500+reward*220 : 1500);
  }else{
    if(Q.attempt===1){
      Q.attempt=2;
      btn.className='opt bad';
      sfxSoft();
      setTimeout(function(){ btn.className='opt gone'; },520);   /* 힌트: 보기 하나 제거 */
      $('#quizMsg').textContent='괜찮아! 하나 지웠어. 다시 골라 봐!';
      speak('괜찮아. 다시 골라 봐!');
    }else if(Q.attempt===2){
      Q.attempt=3;
      sfxSoft();
      var all=document.querySelectorAll('#quizOpts .opt');
      for(var k=0;k<all.length;k++){
        if(parseInt(all[k].textContent,10)===Q.ans) all[k].className='opt point';
        else all[k].className='opt gone';
      }
      $('#quizMsg').textContent='정답은 여기야! 👆 눌러 볼까?';
      speak('정답은 '+korUnit(Q.ans)+' 마리야. 눌러 볼까?');
    }
  }
}

  var col=getCollection();

  saveState();
  hideDino();
  $('#endDino').innerHTML=dinoSVG(PALETTE[0]);
  var st=''; for(var i=0;i<S.todayStars;i++) st+='⭐';
  $('#endStars').textContent=st;
  $('#endMsg').textContent='오늘 별 '+S.todayStars+'개를 모았어요. 지갑에 모두 담았어요!';
  showScreen('end');
  renderWallet();
  confetti(); sfxFanfare();
  speak('오늘은 여기까지! 내일 또 만나!');
}

/* ---------- 모달 ---------- */
function closeModal(){ $('#modalOverlay').classList.remove('on'); }
function openModal(html){
  $('#modalCard').innerHTML=html;
  $('#modalOverlay').classList.add('on');
  return $('#modalCard');
}
/* 코드 보기 */
function showCodeModal(){
  var code=buildCode();
  var c=openModal(
    '<div class="mtitle">이어하기 코드</div>'
   +'<div class="codebox" id="codeText">'+code+'</div>'
   +'<p class="hint">이 코드를 적어 두세요. 다른 기기나 새 브라우저에서<br>[코드 입력]에 넣으면 별·옷장·도감·진행이 돌아와요.<br>(O·0·I·1 은 쓰지 않아요)</p>'
   +'<div class="mfoot"><button class="btn small blue" id="mCopy" type="button">복사하기</button>'
   +'<button class="btn small gray" id="mClose" type="button">닫기</button></div>');
  c.querySelector('#mClose').onclick=closeModal;
  c.querySelector('#mCopy').onclick=function(){
    var t=c.querySelector('#codeText').textContent, ok=false;
    try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t); ok=true; } }catch(e){}
    if(!ok){
      try{
        var ta=el('textarea'); ta.value=t; ta.style.position='fixed'; ta.style.opacity='0';
        document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); ok=true;
      }catch(e2){}
    }
    this.textContent = ok? '복사했어요!' : '직접 적어 주세요';
  };
}
/* 코드 입력 */
function showEnterCodeModal(){
  var c=openModal(
    '<div class="mtitle">코드 입력</div>'
   +'<input class="tin" id="codeIn" placeholder="XXXX-XXXX-XXXX-XXXX" autocomplete="off" spellcheck="false">'
   +'<div class="err" id="codeErr"></div>'
   +'<p class="hint">대문자와 숫자만 있어요. O·0·I·1 은 쓰지 않아요.</p>'
   +'<div class="mfoot"><button class="btn small green" id="mOk" type="button">불러오기</button>'
   +'<button class="btn small gray" id="mClose" type="button">닫기</button></div>');
  var inp=c.querySelector('#codeIn');
  inp.oninput=function(){
    var v=this.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,16);
    this.value=v.replace(/(.{4})(?=.)/g,'$1-');
  };
  c.querySelector('#mClose').onclick=closeModal;
  c.querySelector('#mOk').onclick=function(){
    var d=parseCode(inp.value);
    if(!d){ c.querySelector('#codeErr').textContent='코드가 맞지 않아요. 다시 확인해 주세요.'; return; }
    var w=getWallet();
    if(d.total<w.total || d.stars<w.stars){
      confirmOverwrite(d,w);
    }else{
      applyCode(d); closeModal(); sfxGood();
      openModal('<div class="mtitle">불러왔어요!</div><p class="hint">별 '+getWallet().stars
        +'개, 지금까지 모은 별 '+getWallet().total+'개</p><div class="mfoot"><button class="btn small green" id="mClose2" type="button">좋아요</button></div>');
      $('#modalCard').querySelector('#mClose2').onclick=closeModal;
      renderWallet(); renderStart();
    }
  };
}
function confirmOverwrite(d,w){
  var c=openModal(
    '<div class="mtitle">잠깐만요!</div>'
   +'<p style="font-size:17px;line-height:1.7;text-align:center;margin:0 0 6px;">'
   +'지금 이 기기의 재산이 <b>더 많아요.</b><br>'
   +'<span style="color:#c2185b;font-weight:900;">지금: 별 '+w.stars+'개 / 모은 별 '+w.total+'개</span><br>'
   +'<span style="color:#1d3a7a;font-weight:900;">코드: 별 '+d.stars+'개 / 모은 별 '+d.total+'개</span></p>'
   +'<p class="hint">불러와도 별은 줄지 않게 <b>많은 쪽으로</b> 합쳐요.<br>옷장·도감도 합쳐집니다.</p>'
   +'<div class="mfoot"><button class="btn small gray" id="mKeep" type="button">그대로 두기</button>'
   +'<button class="btn small green" id="mMerge" type="button">합쳐서 불러오기</button></div>');
  c.querySelector('#mKeep').onclick=closeModal;
  c.querySelector('#mMerge').onclick=function(){ applyCode(d); closeModal(); sfxGood(); };
}

/* ---------- 부모 잠금 ---------- */
function openParentGate(){
  var a=rand(4,9), b=rand(4,9), ans=a+b, typed='';
  var c=openModal(
    '<div class="mtitle">어른 확인</div>'
   +'<div class="gate-q">'+a+' + '+b+' = ?</div>'
   +'<div class="gate-a" id="gA">_</div>'
   +'<div class="err" id="gErr"></div>'
   +'<div class="keypad" id="gPad"></div>'
   +'<div class="mfoot"><button class="btn small gray" id="mClose" type="button">닫기</button></div>');
  var pad=c.querySelector('#gPad');
  var keys=['1','2','3','4','5','6','7','8','9','지우기','0','확인'];
  for(var i=0;i<keys.length;i++){
    (function(k){
      var b2=el('button',null,k); b2.type='button';
      b2.onclick=function(){
        if(k==='지우기'){ typed=''; }
        else if(k==='확인'){
          if(parseInt(typed,10)===ans){ closeModal(); openSettings(); return; }
          var ee=c.querySelector('#gErr'); if(ee) ee.textContent='다시 해보세요.';
          typed='';
        }
        else if(typed.length<3){ typed+=k; }
        var ga=c.querySelector('#gA'); if(ga) ga.textContent = typed||'_';
      };
      pad.appendChild(b2);
    })(keys[i]);
  }
  c.querySelector('#mClose').onclick=closeModal;
}

/* ---------- 부모 설정 ---------- */
function openSettings(){
  var tmp={range:S.settings.range,goal:S.settings.goal,quiz:S.settings.quiz};
  var html='<div class="mtitle">부모 설정</div>';
  html+='<div class="mrow"><div class="mlabel">숫자 범위 (1부터 몇까지)</div><div class="chips" id="cRange"></div></div>';
  html+='<div class="mrow"><div class="mlabel">오늘 목표 별 개수</div><div class="chips" id="cGoal"></div></div>';
  html+='<div class="mrow"><div class="mlabel">깜짝 문제 (10마리마다)</div><div class="chips" id="cQuiz"></div></div>';
  html+='<div class="mrow"><div class="mlabel">오늘 기록</div>'
      + '<div style="font-size:15px;color:#5a6478;line-height:1.7;">오늘 모은 별 <b>'+S.todayStars+'개</b> · 오늘 잡은 순서 <b>'+S.count+'</b>'
      + ' · 지금까지 완료한 판 <b>'+S.roundsCleared+'</b></div>'
      + '<div style="margin-top:8px;"><button class="btn small gray" id="bReset" type="button">오늘 기록 초기화(다시 놀기)</button></div>'
      + '<p class="hint" style="text-align:left;">※ 지갑의 별은 그대로 두고, 오늘 목표만 다시 시작합니다.</p></div>';
  html+='<div class="mfoot"><button class="btn small blue" id="bCode" type="button">이어하기 코드</button>'
      + '<button class="btn small gray" id="mClose" type="button">취소</button>'
      + '<button class="btn small green" id="bSave" type="button">저장</button></div>';
  var c=openModal(html);

  function chips(host,vals,cur,fmt,onPick){
    host.innerHTML='';
    for(var i=0;i<vals.length;i++){
      (function(v){
        var b=el('button','chip'+(v===cur?' sel':''),fmt(v)); b.type='button';
        b.onclick=function(){
          var kids=host.querySelectorAll('.chip');
          for(var k=0;k<kids.length;k++) kids[k].className='chip';
          b.className='chip sel'; onPick(v);
        };
        host.appendChild(b);
      })(vals[i]);
    }
  }
  chips(c.querySelector('#cRange'),RANGES,tmp.range,function(v){return '1~'+v;},function(v){tmp.range=v;});
  chips(c.querySelector('#cGoal'),[1,2,3,4,5,6,8,10],tmp.goal,function(v){return v+'개';},function(v){tmp.goal=v;});
  chips(c.querySelector('#cQuiz'),[true,false],tmp.quiz,function(v){return v?'켜기':'끄기';},function(v){tmp.quiz=v;});

  c.querySelector('#mClose').onclick=closeModal;
  c.querySelector('#bCode').onclick=showCodeModal;
  c.querySelector('#bReset').onclick=function(){
    S.todayStars=0; S.count=0; S.sinceQuiz=0; saveState();
    renderWallet(); renderStart(); this.textContent='초기화했어요!';
  };
  c.querySelector('#bSave').onclick=function(){
    var rangeChanged=(tmp.range!==S.settings.range);
    S.settings.range=tmp.range; S.settings.goal=tmp.goal; S.settings.quiz=tmp.quiz;
    if(rangeChanged){ S.count=0; S.sinceQuiz=0; }
    if(S.count>=S.settings.range) S.count=0;
    saveState(); renderWallet(); renderStart(); renderRoundBar();
    if($('#screen-play').className.indexOf('on')>=0){ setBigNum(S.count,false); }
    closeModal();
  };
}

/* ---------- 시작 화면 ---------- */
function renderStart(){
  var done = S.todayStars>=S.settings.goal;
  var b=$('#btnStart');
  if(done){
    b.textContent='오늘은 다 했어요!';
    b.className='btn big gray';
    $('#subtitle').textContent='오늘 별 '+S.todayStars+'개를 다 모았어요. 내일 또 만나요!';
  }else{
    b.textContent = (S.count>0)? '이어서 놀기' : '시작하기';
    b.className='btn big green';
    $('#subtitle').textContent = (S.count>0)
      ? ('지금까지 '+S.count+'마리! 1부터 '+S.settings.range+'까지 세어 봐요.')
      : ('공룡을 눌러서 1부터 '+S.settings.range+'까지 세어 봐요!');
  }
  renderWallet();
}
function startPlay(){
  actx();
  if(S.todayStars>=S.settings.goal){ endGame(); return; }
  showScreen('play');
  setBigNum(S.count,false);
  renderRoundBar();
  spawnDino();
  speak('공룡을 잡아 볼까?');
}

/* ---------- 초기화 ---------- */
function boot(){
  ensureSharedKeys();
  S=loadState();
  dinoEl=$('#dino'); bignumEl=$('#bignum');
  $('#startDino').innerHTML=dinoSVG(PALETTE[0]);
  dinoEl.addEventListener('click',onCatch);
  $('#btnStart').onclick=startPlay;
  $('#btnShowCode').onclick=showCodeModal;
  $('#btnEndCode').onclick=showCodeModal;
  $('#btnEnterCode').onclick=showEnterCodeModal;
  $('#btnParent').onclick=openParentGate;
  $('#btnCelebNext').onclick=onCelebNext;
  $('#modalOverlay').addEventListener('click',function(e){ if(e.target===this) closeModal(); });
  renderStart();
  saveState();
  window.addEventListener('beforeunload',function(){ try{ saveState(); }catch(e){} });
}
boot();
</script>
