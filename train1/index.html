<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>패턴 기차 잇기</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  background:linear-gradient(180deg,#E3F2FD 0%,#BBDEFB 100%);min-height:100vh;}
#app{max-width:480px;margin:0 auto;min-height:100vh;padding:12px;position:relative;overflow-x:hidden;}
.screen{display:none;}
.screen.on{display:block;animation:fadein .25s;}
@keyframes fadein{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
#hud{display:none;align-items:center;gap:8px;padding:8px 10px;background:#FFFFFFCC;
  border-radius:16px;margin-bottom:10px;box-shadow:0 2px 6px #0002;}
.hud-item{font-size:22px;font-weight:bold;color:#0D47A1;}
.hud-btn{font-size:19px;font-weight:bold;border:none;background:#90CAF9;color:#0D47A1;
  border-radius:12px;padding:8px 12px;min-height:44px;font-family:inherit;}
.gear{margin-left:auto;border:none;background:#EEE;border-radius:50%;
  width:40px;height:40px;font-size:20px;}
h1{color:#1565C0;font-size:30px;text-align:center;margin:8px 0;line-height:1.3;}
h2{color:#1565C0;font-size:24px;text-align:center;}
.mascot{font-size:80px;text-align:center;margin:20px 0 4px;}
.sub{text-align:center;color:#1976D2;font-size:18px;margin:4px 0 16px;}
.btn{display:block;width:100%;min-height:64px;font-size:24px;font-weight:bold;
  border:none;border-radius:20px;margin:10px 0;cursor:pointer;
  box-shadow:0 4px 0 #0002;font-family:inherit;}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #0002;}
.big{background:#1E88E5;color:#fff;font-size:30px;min-height:80px;}
.mid{background:#FFD54F;color:#6D4C00;}
#goalBar{background:#FFF;border-radius:12px;padding:8px;text-align:center;
  font-size:18px;color:#0D47A1;font-weight:bold;margin-bottom:10px;}
#patCard{background:#FFF;border-radius:20px;padding:16px 10px;text-align:center;
  box-shadow:0 3px 8px #0002;margin-bottom:12px;}
#patSeq{font-size:34px;line-height:1.5;word-break:keep-all;}
.unit{display:inline-block;border:3px solid #FF7043;border-radius:12px;
  padding:2px 4px;margin:2px;}
.qmark{display:inline-block;background:#FFF9C4;border:3px dashed #FBC02D;
  border-radius:12px;padding:2px 10px;color:#F57F17;font-weight:bold;}
#choiceRow{display:flex;gap:10px;}
.choice{flex:1;min-height:76px;font-size:32px;border:none;border-radius:20px;
  background:#FFF;box-shadow:0 4px 0 #0003;cursor:pointer;font-family:inherit;}
.choice:active{transform:translateY(2px);}
.choice.gone{visibility:hidden;}
.choice.glow{background:#C8E6C9;animation:glow .8s infinite alternate;}
@keyframes glow{from{box-shadow:0 0 4px #66BB6A;}to{box-shadow:0 0 22px #2E7D32;}}
.choice.wrongflash{background:#EF9A9A;}
#feedback{min-height:30px;text-align:center;font-size:19px;color:#6A1B9A;
  font-weight:bold;margin:8px 0;}
#trainBox{background:#FFF;border-radius:16px;padding:10px 6px;margin-top:10px;
  box-shadow:0 2px 6px #0002;overflow:hidden;}
#trainLabel{font-size:15px;color:#5D4037;font-weight:bold;margin-bottom:4px;}
#trainLine{font-size:26px;white-space:nowrap;overflow-x:auto;padding-bottom:4px;}
.runwrap{position:relative;height:60px;overflow:hidden;margin:8px 0;}
.runner{position:absolute;top:6px;left:100%;font-size:34px;white-space:nowrap;
  animation:run 3s linear;}
@keyframes run{from{transform:translateX(0);}to{transform:translateX(calc(-100vw - 100%));}}
.ov{display:none;position:fixed;inset:0;background:#0008;z-index:50;
  align-items:center;justify-content:center;padding:16px;}
.ov.on{display:flex;}
.ov-box{background:#FFF;border-radius:24px;padding:24px 18px;max-width:420px;width:100%;
  text-align:center;max-height:90vh;overflow:auto;}
.ov-box h3{color:#1565C0;font-size:22px;margin:0 0 12px;}
.codebox{font-size:26px;font-weight:bold;letter-spacing:2px;color:#1565C0;
  background:#E3F2FD;border-radius:12px;padding:14px 6px;margin:12px 0;word-break:break-all;}
input,select{width:100%;min-height:52px;font-size:20px;border:2px solid #64B5F6;
  border-radius:12px;padding:6px 10px;margin:6px 0;font-family:inherit;background:#FFF;}
.plabel{display:block;text-align:left;font-size:16px;color:#0D47A1;font-weight:bold;margin-top:12px;}
.fly{position:fixed;font-size:38px;z-index:99;transition:all .8s cubic-bezier(.5,-0.2,.8,1);
  pointer-events:none;}
.pop{display:inline-block;animation:pop .5s;}
@keyframes pop{0%{transform:scale(0);}70%{transform:scale(1.3);}100%{transform:scale(1);}}
#scr_parent{background:#E8EAF6;border-radius:16px;padding:12px;}
</style>
</head>
<body>
<div id="app">

  <div id="hud">
    <div class="hud-item">⭐ <span class="hud-stars">0</span></div>
    <button id="btnTrain" class="hud-btn">🚂 내 기차 <span id="hudCars">0</span>칸</button>
    <button id="btnGear" class="gear" aria-label="부모 설정">⚙️</button>
  </div>

  <div id="scr_start" class="screen on">
    <div class="mascot">🚂</div>
    <h1>패턴 기차 잇기</h1>
    <p class="sub">규칙을 찾아 맞히면<br>내 기차가 길어져요!</p>
    <button id="btnStart" class="btn big">▶ 출발!</button>
    <button id="btnShowCode" class="btn mid">🔑 이어하기 코드 보기</button>
    <button id="btnEnterCode" class="btn mid">⌨️ 코드 입력</button>
  </div>

  <div id="scr_game" class="screen">
    <div id="goalBar">오늘의 패턴 <span id="goalNow">0</span> / <span id="goalMax">7</span></div>
    <div id="patCard">
      <div id="patSeq"></div>
      <button id="btnSpeak" class="btn mid" style="min-height:48px;font-size:17px;width:auto;padding:0 16px;margin:10px auto 0;">🔊 다시 듣기</button>
    </div>
    <p class="sub" style="margin:4px 0;">빈칸에 올 것은 무엇일까요?</p>
    <div id="choiceRow"></div>
    <div id="feedback"></div>
    <div id="trainBox">
      <div id="trainLabel">🚂 내 기차</div>
      <div id="trainLine"></div>
    </div>
    <div class="runwrap" id="runWrap"></div>
  </div>

  <div id="scr_train" class="screen">
    <h2>🚂 내 기차 구경</h2>
    <p class="sub" id="trainMsg"></p>
    <div id="trainBox2" style="background:#FFF;border-radius:16px;padding:10px;box-shadow:0 2px 6px #0002;">
      <div id="trainLine2" style="font-size:26px;line-height:1.6;word-break:break-all;"></div>
    </div>
    <button id="btnTrainBack" class="btn mid">돌아가기</button>
  </div>

  <div id="scr_end" class="screen">
    <div class="mascot">🌙</div>
    <h1>오늘은 여기까지!<br>내일 또 만나!</h1>
    <p class="sub" id="endMsg"></p>
    <div class="runwrap" id="endRun"></div>
    <button id="btnEndTrain" class="btn mid">🚂 내 기차 구경하기</button>
    <button id="btnEndCode" class="btn mid">🔑 이어하기 코드 보기</button>
  </div>

  <div id="scr_parent" class="screen">
    <h2>⚙️ 부모 설정</h2>
    <label class="plabel">단계</label>
    <select id="setLevel">
      <option value="1">1단계 — AB 반복 (빨강 파랑)</option>
      <option value="2">2단계 — AAB·ABB 반복</option>
      <option value="3">3단계 — ABC 반복</option>
      <option value="4">4단계 — 커지는 패턴 (1개, 2개, 3개…)</option>
    </select>
    <label class="plabel">그림 종류</label>
    <select id="setTheme">
      <option value="color">색깔</option>
      <option value="shape">모양</option>
      <option value="fruit">과일</option>
      <option value="dino">공룡</option>
    </select>
    <label class="plabel">오늘 목표 패턴 개수 (1~20)</label>
    <input id="setGoal" type="number" min="1" max="20">
    <button id="btnParentClose" class="btn big" style="font-size:22px;">저장하고 닫기</button>
  </div>

</div>

<div id="ov_gate" class="ov">
  <div class="ov-box">
    <h3>부모님 확인 문제</h3>
    <p style="font-size:26px;font-weight:bold;">7 + 8 = ?</p>
    <input id="gateInput" type="number" inputmode="numeric" placeholder="정답을 쓰세요">
    <button id="btnGateOk" class="btn mid">확인</button>
    <button id="btnGateNo" class="btn" style="background:#EEE;color:#555;">닫기</button>
  </div>
</div>

<div id="ov_codeview" class="ov">
  <div class="ov-box">
    <h3>🔑 이어하기 코드</h3>
    <p style="font-size:16px;color:#1976D2;">이 코드를 적어 두면<br>다른 기기에서 이어할 수 있어요.</p>
    <div class="codebox" id="codeOut"></div>
    <button id="btnCodeViewClose" class="btn mid">닫기</button>
  </div>
</div>

<div id="ov_codein" class="ov">
  <div class="ov-box">
    <h3>⌨️ 코드 입력</h3>
    <input id="codeIn" placeholder="예: AB2C-DE3F-GH4J-KLM" autocapitalize="characters">
    <button id="btnCodeApply" class="btn mid">불러오기</button>
    <button id="btnCodeInClose" class="btn" style="background:#EEE;color:#555;">닫기</button>
  </div>
</div>

<div id="ov_car" class="ov">
  <div class="ov-box">
    <div style="font-size:64px;" id="carShow">🚃</div>
    <h3 id="carMsg">새 기차 칸 연결!</h3>
    <button id="btnCarNext" class="btn big" style="font-size:24px;">다음</button>
  </div>
</div>

<script>
/* ============================================================
   공통 저장 라이브러리 v1 — 부록 A 공통 저장 규격 v2 구현
   모든 게임에 이 블록을 그대로 <script> 안에 붙여 넣는다.
   게임별로 바꾸는 것은 GAME_ID 한 줄뿐이다.
   ============================================================ */
var GAME_ID = "train1"; // 저장 키: game_save_train1

/* 세이브 코드 문자셋: 영문 대문자+숫자 32자, O·0·I·1 제외 */
var CS = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

/* ---------- localStorage 안전 입출력 ---------- */
function lsGet(k, def) {
  try {
    var v = JSON.parse(localStorage.getItem(k));
    return (v && typeof v === "object") ? v : JSON.parse(JSON.stringify(def));
  } catch (e) { return JSON.parse(JSON.stringify(def)); }
}
function lsSet(k, obj) {
  try { localStorage.setItem(k, JSON.stringify(obj)); } catch (e) { /* 저장 실패해도 게임은 계속 */ }
}

/* ---------- 공용 4키 (있는 키는 절대 지우지 않고 읽어서 이어 씀) ---------- */
function getWallet()  { return lsGet("game_wallet",     {v:1, stars:0, total:0}); }
function getCloset()  { return lsGet("game_closet",     {v:1, owned:[], wearing:{}}); }
function getColl()    { return lsGet("game_collection", {v:1, badges:[], cards:[]}); }
function getSave(def) { return lsGet("game_save_" + GAME_ID, def || {}); }
function putWallet(w) { lsSet("game_wallet", w); }
function putCloset(c) { lsSet("game_closet", c); }
function putColl(c)   { lsSet("game_collection", c); }
function putSave(s)   { lsSet("game_save_" + GAME_ID, s); }

/* 별 획득: stars와 total을 함께 올린다. total은 절대 줄지 않는다 */
function addStars(n) {
  var w = getWallet(); w.stars += n; w.total += n; putWallet(w);
}
/* 별 사용(상점): stars만 줄인다. 부족하면 false */
function spendStars(n) {
  var w = getWallet(); if (w.stars < n) return false;
  w.stars -= n; putWallet(w); return true;
}
/* 뱃지·카드 획득(중복 방지) */
function addBadge(n) { var c = getColl(); if (c.badges.indexOf(n) < 0) { c.badges.push(n); putColl(c); } }
function addCard(n)  { var c = getColl(); if (c.cards.indexOf(n)  < 0) { c.cards.push(n);  putColl(c); } }

/* ---------- 세이브 코드 (15자: 데이터 14 + 검사 1, 4자마다 하이픈) ----------
   구성: stars(2) total(2) closet소유비트(3) badges비트(3) cards비트(2) 진행p1(1) 진행p2(1)
   숫자 2자 = 0~1023, 비트 3자 = 항목 1~15번, 비트 2자 = 항목 1~10번, 1자 = 0~31 */
function enc2(n) { n = Math.max(0, Math.min(1023, Math.round(n||0))); return CS[Math.floor(n/32)] + CS[n%32]; }
function dec2(s) { return CS.indexOf(s[0])*32 + CS.indexOf(s[1]); }
function encBits(arr, chars) { /* 번호 배열 -> chars글자 비트마스크 */
  var bits = 0;
  (arr||[]).forEach(function(x){ x = parseInt(x,10); if (x >= 1 && x <= chars*5) bits |= (1 << (x-1)); });
  var out = "";
  for (var i = chars-1; i >= 0; i--) out += CS[(bits >> (i*5)) & 31];
  return out;
}
function decBits(s) { /* 글자들 -> 번호 배열 */
  var bits = 0, i;
  for (i = 0; i < s.length; i++) bits = (bits << 5) | CS.indexOf(s[i]);
  var arr = [];
  for (i = 1; i <= s.length*5; i++) if (bits & (1 << (i-1))) arr.push(i);
  return arr;
}
function makeCode(p1, p2) {
  var w = getWallet(), c = getCloset(), k = getColl();
  var raw = enc2(w.stars) + enc2(w.total) + encBits(c.owned,3) + encBits(k.badges,3) + encBits(k.cards,2) + CS[Math.max(0,Math.min(31,p1||0))] + CS[Math.max(0,Math.min(31,p2||0))];
  var sum = 0; for (var i = 0; i < raw.length; i++) sum += CS.indexOf(raw[i]);
  raw += CS[sum % 32];
  return raw.replace(/(.{4})/g, "$1-").replace(/-$/, "");
}
function parseCode(str) {
  var raw = (str||"").toUpperCase().replace(/[^A-Z2-9]/g, "");
  if (raw.length !== 15) return null;
  var sum = 0, i, x;
  for (i = 0; i < 14; i++) { x = CS.indexOf(raw[i]); if (x < 0) return null; sum += x; }
  if (CS[sum % 32] !== raw[14]) return null; /* 검사 글자 불일치 = 오타 */
  return {
    stars:  dec2(raw.slice(0,2)),
    total:  dec2(raw.slice(2,4)),
    owned:  decBits(raw.slice(4,7)),
    badges: decBits(raw.slice(7,10)),
    cards:  decBits(raw.slice(10,12)),
    p1: CS.indexOf(raw[12]),
    p2: CS.indexOf(raw[13])
  };
}
/* 복원 적용: 재산이 지금보다 적으면 confirmFn(안내문)이 true일 때만 덮어씀.
   total은 어떤 경우에도 큰 값을 유지한다. 반환: "ok" | "cancel" | "bad" */
function applyCode(str, confirmFn) {
  var d = parseCode(str);
  if (!d) return "bad";
  var w = getWallet();
  if (d.total < w.total || d.stars < w.stars) {
    var msg = "입력한 코드의 재산(별 " + d.stars + "개)이 지금 기기(별 " + w.stars + "개)보다 적어요. 그래도 코드 쪽으로 되돌릴까요?";
    if (!confirmFn(msg)) return "cancel";
  }
  putWallet({v:1, stars:d.stars, total:Math.max(d.total, w.total)});
  var c = getCloset(); c.owned = d.owned; putCloset(c);
  putColl({v:1, badges:d.badges, cards:d.cards});
  return "ok";
}

/* ---------- 한국어 음성(TTS): 화면 첫 터치 후부터 동작 ---------- */
function speak(txt) {
  try {
    if (!window.speechSynthesis) return;
    var u = new SpeechSynthesisUtterance(txt);
    u.lang = "ko-KR"; u.rate = 0.9;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}
/* ---------- 효과음(WebAudio, 외부 파일 없음) ---------- */
var _ac = null;
function _ctx() { if (!_ac) { try { _ac = new (window.AudioContext||window.webkitAudioContext)(); } catch(e){} } return _ac; }
function beep(freq, dur, type) {
  var ac = _ctx(); if (!ac) return;
  var o = ac.createOscillator(), g = ac.createGain();
  o.type = type || "sine"; o.frequency.value = freq;
  g.gain.setValueAtTime(0.25, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + (dur||0.15));
  o.connect(g); g.connect(ac.destination);
  o.start(); o.stop(ac.currentTime + (dur||0.15));
}
function sfxGood()  { beep(660,0.12); setTimeout(function(){beep(880,0.12);},110); setTimeout(function(){beep(1320,0.2);},220); }
function sfxHint()  { beep(440,0.15,"triangle"); }
function sfxDone()  { [523,659,784,1047].forEach(function(f,i){ setTimeout(function(){beep(f,0.18);}, i*140); }); }
/* ============================================================ */

/* ============================================================
   게임 본체: 패턴 기차 잇기 (게임ID train1)
   ============================================================ */

var SETS = {
  color: {list:["🔴","🔵","🟡","🟢","🟣"], names:["빨강","파랑","노랑","초록","보라"]},
  shape: {list:["⭐","🔺","🟦","❤️","🔶"], names:["별","세모","네모","하트","마름모"]},
  fruit: {list:["🍎","🍌","🍇","🍊","🍓"], names:["사과","바나나","포도","귤","딸기"]},
  dino:  {list:["🦖","🦕","🐉","🦎","🐢"], names:["티라노","브라키오","용","도마뱀","거북"]}
};
var CAR_COLORS = ["🟥","🟧","🟨","🟩","🟦","🟪","🟫","⬜"];
var GOLD_CAR = 9; /* 10칸마다 특별 황금 칸 */

var save = getSave({v:1, level:1, theme:"color", goal:7, date:"", doneToday:0, cars:[], solved:0});
if (!save.level) save.level = 1;
if (!save.theme || !SETS[save.theme]) save.theme = "color";
if (!save.goal) save.goal = 7;
if (!save.cars) save.cars = [];

function todayStr(){ var d = new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function resetDaily(){
  if (save.date !== todayStr()) { save.date = todayStr(); save.doneToday = 0; putSave(save); }
}
resetDaily();

/* ---------- 화면 유틸 ---------- */
function $(id){ return document.getElementById(id); }
var HUD_ON = {scr_game:1, scr_train:1, scr_end:1};
function show(id){
  var s = document.querySelectorAll(".screen");
  for (var i = 0; i < s.length; i++) s[i].classList.remove("on");
  $(id).classList.add("on");
  $("hud").style.display = HUD_ON[id] ? "flex" : "none";
  updateHud();
}
function updateHud(){
  var w = getWallet();
  var els = document.querySelectorAll(".hud-stars");
  for (var i = 0; i < els.length; i++) els[i].textContent = w.stars;
  $("hudCars").textContent = save.cars.length;
  $("goalNow").textContent = Math.min(save.doneToday, save.goal);
  $("goalMax").textContent = save.goal;
}
function flyStar(count){
  var t = $("hud").querySelector(".hud-item").getBoundingClientRect();
  for (var i = 0; i < count; i++) {
    (function(i){
      setTimeout(function(){
        var s = document.createElement("div");
        s.className = "fly"; s.textContent = "⭐";
        s.style.left = "45%"; s.style.top = "40%";
        document.body.appendChild(s);
        requestAnimationFrame(function(){
          requestAnimationFrame(function(){
            s.style.left = t.left + "px"; s.style.top = t.top + "px";
            s.style.transform = "scale(.4)"; s.style.opacity = ".6";
          });
        });
        setTimeout(function(){ if (s.parentNode) s.parentNode.removeChild(s); updateHud(); }, 850);
      }, i * 220);
    })(i);
  }
}
function carEmoji(code){ return code === GOLD_CAR ? "🌟" : CAR_COLORS[code % CAR_COLORS.length]; }
function renderTrain(){
  /* 기차는 최근 30칸만 그리고 나머지는 숫자로 표시 */
  var cars = save.cars;
  var extra = cars.length > 30 ? "(+" + (cars.length - 30) + "칸) " : "";
  var shown = cars.slice(-30).map(carEmoji).join("");
  $("trainLine").textContent = "🚂" + extra + shown;
}
function runTrain(wrapId, count){
  var wrap = $(wrapId); if (!wrap) return;
  wrap.innerHTML = "";
  var r = document.createElement("div");
  r.className = "runner";
  r.textContent = "🚂" + save.cars.slice(-Math.min(count || 8, 30)).map(carEmoji).join("");
  wrap.appendChild(r);
  setTimeout(function(){ if (r.parentNode) r.parentNode.removeChild(r); }, 3100);
}

/* ---------- 패턴 자동 생성 ---------- */
var cur = null, tries = 0, guided = false, lastSig = "";
function rand(n){ return Math.floor(Math.random() * n); }
function shuffle(a){
  for (var i = a.length - 1; i > 0; i--) {
    var j = rand(i + 1); var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function genPattern(){
  var set = SETS[save.theme];
  var pool = shuffle(set.list.slice());
  var A = pool[0], B = pool[1], C = pool[2];
  var lvl = save.level, unit, seq = [], answer, choices, sig, disp, i;

  if (lvl === 4) {
    /* 커지는 패턴: A | AA | AAA | ? → AAAA */
    var startN = 1 + rand(2); /* 1 또는 2에서 시작 */
    var groups = [];
    for (i = 0; i < 3; i++) {
      var g = "";
      for (var k = 0; k < startN + i; k++) g += A;
      groups.push(g);
    }
    var ansN = startN + 3;
    var mk = function(n){ var s2 = ""; for (var m = 0; m < n; m++) s2 += A; return s2; };
    answer = mk(ansN);
    choices = shuffle([answer, mk(ansN - 1), mk(ansN + 1)]);
    sig = "L4" + save.theme + A + startN;
    cur = {seq:groups, answer:answer, choices:choices, grow:true, unit:null,
      say:"하나씩 커지는 패턴이에요. 다음 칸에는 몇 개가 올까요?"};
    return sig;
  }

  if (lvl === 1) unit = [A, B];
  else if (lvl === 2) unit = rand(2) ? [A, A, B] : [A, B, B];
  else unit = [A, B, C];

  var shownCount = 5 + rand(3); /* 5~7개 보여주기 */
  for (i = 0; i < shownCount + 1; i++) seq.push(unit[i % unit.length]);
  answer = seq[shownCount];
  disp = seq.slice(0, shownCount);

  var others = [];
  for (i = 0; i < set.list.length; i++) if (set.list[i] !== answer) others.push(set.list[i]);
  shuffle(others);
  choices = shuffle([answer, others[0], others[1]]);
  sig = "L" + lvl + save.theme + unit.join("");
  cur = {seq:disp, answer:answer, choices:choices, grow:false, unit:unit,
    say:"그림이 규칙대로 늘어서 있어요. 빈칸에 올 것을 골라 보세요."};
  return sig;
}
function newProblem(){
  /* 같은 문제가 연속 반복되지 않게 */
  var sig = genPattern(), guard = 0;
  while (sig === lastSig && guard < 10) { sig = genPattern(); guard++; }
  lastSig = sig;
  tries = 0; guided = false;
  renderProblem(false);
  show("scr_game");
  renderTrain();
  speak(cur.say);
}
function renderProblem(withHint){
  var html = "", i;
  if (cur.grow) {
    for (i = 0; i < cur.seq.length; i++) {
      html += (withHint ? "<span class='unit'>" + cur.seq[i] + "</span>" : cur.seq[i]) + " ";
    }
  } else if (withHint) {
    /* 힌트: 패턴 한 묶음씩 테두리로 묶어 보여주기 */
    var L = cur.unit.length;
    for (i = 0; i < cur.seq.length; i += L) {
      html += "<span class='unit'>" + cur.seq.slice(i, i + L).join("") + "</span>";
    }
  } else {
    html = cur.seq.join("");
  }
  html += " <span class='qmark'>?</span>";
  $("patSeq").innerHTML = html;
  var row = $("choiceRow"); row.innerHTML = "";
  cur.choices.forEach(function(c){
    var b = document.createElement("button");
    b.className = "choice"; b.textContent = c;
    b.onclick = function(){ pick(b, c); };
    row.appendChild(b);
  });
  if (!withHint) $("feedback").textContent = "";
}
function pick(btn, val){
  if (!cur) return;
  if (val === cur.answer) {
    finishRound(btn, guided ? 0 : (tries === 0 ? 2 : 1));
  } else {
    tries++;
    btn.classList.add("wrongflash");
    setTimeout(function(){ btn.classList.remove("wrongflash"); }, 500);
    sfxHint();
    if (tries === 1) {
      $("feedback").textContent = "괜찮아요! 소리 내어 읽으며 다시 볼까요?";
      speak("괜찮아요. 그림을 소리 내어 읽으면서 다시 한 번 볼까요?");
    } else if (tries === 2) {
      renderProblem(true); /* 묶음 테두리 힌트 */
      $("feedback").textContent = "💡 힌트! 같은 묶음끼리 테두리로 묶었어요.";
      speak("힌트! 같은 묶음끼리 테두리로 묶어 줬어요. 묶음이 어떻게 반복되나요?");
    } else {
      guided = true;
      var bs = $("choiceRow").querySelectorAll(".choice");
      for (var j = 0; j < bs.length; j++) {
        if (bs[j].textContent === cur.answer) bs[j].classList.add("glow");
        else bs[j].classList.add("gone");
      }
      $("feedback").textContent = "정답을 알려 줄게요! 반짝이는 버튼을 따라 눌러 보세요.";
      speak("정답을 알려 줄게요. 반짝이는 버튼을 따라 눌러 보세요.");
    }
  }
}
function finishRound(btn, stars){
  cur = null;
  sfxGood();
  btn.classList.add("glow");
  if (stars > 0) { addStars(stars); flyStar(stars); }
  /* 새 기차 칸 연결 (10칸마다 황금 칸) */
  var nextNo = save.cars.length + 1;
  var code = (nextNo % 10 === 0) ? GOLD_CAR : rand(CAR_COLORS.length);
  save.cars.push(code);
  save.doneToday++; save.solved++;
  putSave(save); /* 판이 끝날 때마다 자동 저장 */
  updateHud(); renderTrain();
  runTrain("runWrap", 8); /* 기차가 화면을 한 번 달린다 */
  var gold = (code === GOLD_CAR);
  var starTxt = stars === 2 ? "별 2개!" : (stars === 1 ? "별 1개!" : "잘 따라 했어요!");
  setTimeout(function(){
    $("carShow").innerHTML = "<span class='pop'>🚂" + carEmoji(code) + "</span>";
    $("carMsg").textContent = (gold ? "✨ " + nextNo + "번째 특별 황금 칸! ✨ " : "새 기차 칸 연결! ") + starTxt;
    $("btnCarNext").textContent = (save.doneToday >= save.goal) ? "끝 화면 보기" : "다음";
    $("ov_car").classList.add("on");
    speak(gold ? "우와! 특별한 황금 칸이에요! 칙칙폭폭!" : "새 기차 칸이 연결됐어요! 칙칙폭폭!");
  }, 700);
}
$("btnCarNext").onclick = function(){
  $("ov_car").classList.remove("on");
  if (save.doneToday >= save.goal) showEnd(); else newProblem();
};
$("btnSpeak").onclick = function(){ if (cur) speak(cur.say); };

function showEnd(){
  show("scr_end");
  $("endMsg").textContent = "오늘 패턴 " + save.doneToday + "개를 맞혔어요. 내 기차는 " + save.cars.length + "칸!";
  sfxDone();
  runTrain("endRun", 30); /* 긴 기차가 달리는 끝 화면 */
  speak("오늘은 여기까지! 기차가 " + save.cars.length + "칸이 됐어요. 내일 또 만나요!");
}

/* ---------- 내 기차 구경 ---------- */
var trainFrom = "scr_game";
function showTrainView(from){
  trainFrom = from;
  var cars = save.cars;
  $("trainMsg").textContent = "내 기차는 모두 " + cars.length + "칸이에요." +
    (cars.length > 30 ? " (최근 30칸만 보여요)" : "");
  $("trainLine2").textContent = "🚂" + cars.slice(-30).map(carEmoji).join("");
  show("scr_train");
}
$("btnTrain").onclick = function(){ showTrainView(save.doneToday >= save.goal ? "scr_end" : "scr_game"); };
$("btnEndTrain").onclick = function(){ showTrainView("scr_end"); };
$("btnTrainBack").onclick = function(){
  if (trainFrom === "scr_end" || save.doneToday >= save.goal) showEnd();
  else if (cur) show("scr_game");
  else show("scr_start");
};

/* ---------- 시작·코드 ---------- */
$("btnStart").onclick = function(){
  _ctx(); /* 소리 잠금 해제 */
  sfxGood();
  resetDaily();
  if (save.doneToday >= save.goal) { showEnd(); return; }
  newProblem();
};
function openCodeView(){
  $("codeOut").textContent = makeCode(Math.min(save.level,31), Math.min(save.cars.length,31));
  $("ov_codeview").classList.add("on");
}
$("btnShowCode").onclick = openCodeView;
$("btnEndCode").onclick = openCodeView;
$("btnCodeViewClose").onclick = function(){ $("ov_codeview").classList.remove("on"); };
$("btnEnterCode").onclick = function(){ $("codeIn").value = ""; $("ov_codein").classList.add("on"); };
$("btnCodeInClose").onclick = function(){ $("ov_codein").classList.remove("on"); };
$("btnCodeApply").onclick = function(){
  var str = $("codeIn").value;
  var r = applyCode(str, function(m){ return window.confirm(m); });
  if (r === "ok") {
    /* 코드의 진행 정보(p1=단계, p2=기차 칸 수)도 이어받기 — 기차는 절대 줄이지 않음 */
    var d = parseCode(str);
    if (d) {
      if (d.p1 >= 1 && d.p1 <= 4) save.level = d.p1;
      while (save.cars.length < d.p2) {
        var no = save.cars.length + 1;
        save.cars.push(no % 10 === 0 ? GOLD_CAR : rand(CAR_COLORS.length));
      }
      putSave(save);
    }
    $("ov_codein").classList.remove("on");
    updateHud();
    alert("코드를 불러왔어요! 이어서 놀 수 있어요.");
  } else if (r === "bad") {
    alert("코드를 다시 확인해 주세요. 글자가 틀린 것 같아요.");
  }
};

/* ---------- 부모 설정 (톱니 → 7+8 확인) ---------- */
$("btnGear").onclick = function(){ $("gateInput").value = ""; $("ov_gate").classList.add("on"); };
$("btnGateNo").onclick = function(){ $("ov_gate").classList.remove("on"); };
$("btnGateOk").onclick = function(){
  if (parseInt($("gateInput").value, 10) === 15) {
    $("ov_gate").classList.remove("on");
    $("setLevel").value = String(save.level);
    $("setTheme").value = save.theme;
    $("setGoal").value = save.goal;
    show("scr_parent");
  } else {
    alert("정답이 아니에요. 부모님께 물어보세요!");
  }
};
$("btnParentClose").onclick = function(){
  save.level = parseInt($("setLevel").value, 10) || 1;
  save.theme = $("setTheme").value;
  var g = parseInt($("setGoal").value, 10);
  if (g >= 1 && g <= 20) save.goal = g;
  putSave(save);
  if (save.doneToday >= save.goal) showEnd();
  else newProblem();
};

updateHud();
renderTrain();
</script>
